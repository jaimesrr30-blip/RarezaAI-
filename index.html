<style>
  :root{
    --bg:#080b18; --bg2:#0d0a1f;
    --panel: rgba(255,255,255,0.055); --panel-strong: rgba(255,255,255,0.09);
    --border: rgba(140,180,255,0.16);
    --blue:#8B5CF6; --blue2:#E052C4; --blue-glow: rgba(139,92,246,0.55);
    --gold:#FFD37A; --aurora:#5EE7DF;
    --bubble1:#8B5CF6; --bubble2:#E052C4;
    --text:#F4F2FB; --text-dim:#a3a8c9; --text-dim2:#666a92; --danger:#ff5d7a;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--bg); overflow:hidden;}
  body{font-family:'Inter',sans-serif; color:var(--text); position:relative; width:100vw; height:100vh;}
  h1,h2,h3,.display{font-family:'Fraunces',serif; font-weight:600;}
  #stars{position:fixed; inset:0; z-index:0; pointer-events:none;}
  #app{position:relative; z-index:1; width:100%; height:100%; overflow:hidden;}
  .screen{position:absolute; inset:0; display:flex; flex-direction:column; animation:fadeIn .5s ease both;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  @keyframes popIn{from{opacity:0; transform:scale(.85);} to{opacity:1; transform:scale(1);}}
  @keyframes floaty{0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);}}
  @keyframes shimmerText{0%{background-position:0% 50%;} 100%{background-position:200% 50%;}}
  @keyframes dotBounce{0%,80%,100%{transform:translateY(0); opacity:.4;} 40%{transform:translateY(-6px); opacity:1;}}
  @keyframes scanLine{0%{top:0%;} 100%{top:100%;}}
  @keyframes rarityGlowSoft{0%,100%{box-shadow:0 0 10px var(--rc);} 50%{box-shadow:0 0 20px var(--rc);}}
  @keyframes rarityGlowMed{0%,100%{box-shadow:0 0 16px var(--rc);} 50%{box-shadow:0 0 32px var(--rc);}}
  @keyframes rarityShimmer{0%{background-position:-150% 0;} 100%{background-position:250% 0;}}
  @keyframes rarityAura{0%,100%{box-shadow:0 0 22px var(--rc),0 0 46px var(--rc);} 50%{box-shadow:0 0 40px var(--rc),0 0 74px var(--rc);}}
  @keyframes rarityCycle{0%{filter:hue-rotate(0deg);} 100%{filter:hue-rotate(360deg);}}
  @keyframes sparkPop{0%{transform:scale(0) translate(0,0); opacity:1;} 100%{transform:scale(1) translate(var(--sx),var(--sy)); opacity:0;}}
  @keyframes countUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(120,160,255,.35); border-radius:10px;}
  button{font-family:inherit;}
  .btn{border:1px solid var(--border); background:linear-gradient(180deg, rgba(255,95,168,.22), rgba(95,212,255,.14));
    color:var(--text); padding:11px 18px; border-radius:14px; font-weight:600; font-size:13.5px; cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;}
  .btn:hover{transform:scale(1.035); box-shadow:0 6px 24px rgba(255,95,168,.28);}
  .btn:active{transform:scale(.96);}
  .btn.primary{background:linear-gradient(135deg, var(--blue), var(--blue2)); border:none; box-shadow:0 4px 20px rgba(255,95,168,.35);}
  .btn.primary:hover{box-shadow:0 6px 30px rgba(255,95,168,.5);}
  .btn.ghost{background:transparent; border:1px solid var(--border);}
  .btn.small{padding:7px 12px; font-size:11.5px; border-radius:11px;}
  .btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}
  input.field{width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--border);
    background:rgba(255,255,255,.045); color:var(--text); font-size:13.5px; outline:none; transition:border .18s, box-shadow .18s;}
  input.field:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(255,95,168,.18);}
  input.field::placeholder{color:var(--text-dim2);}
  .glass{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);}

  /* SPLASH */
  #screen-splash{align-items:center; justify-content:center; text-align:center; gap:18px; cursor:pointer;}
  .splash-loadbar{width:170px; height:5px; border-radius:6px; background:rgba(255,255,255,.1); overflow:hidden; position:relative;}
  .splash-loadbar-fill{position:absolute; top:0; bottom:0; width:40%; border-radius:6px;
    background:linear-gradient(90deg, var(--blue), #a463ff); animation:splashLoad 1.3s ease-in-out infinite;}
  @keyframes splashLoad{0%{left:-40%;} 100%{left:100%;}}
  .logo-big{font-family:'Fraunces',serif; font-size:52px; font-weight:700; letter-spacing:-1px;
    background:linear-gradient(90deg, #ff8fc4, #ff5fa8, #9fe8ff, #ff5fa8); background-size:200% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shimmerText 4s linear infinite; filter:drop-shadow(0 0 26px rgba(255,95,168,.45));}
  .logo-sub{color:var(--text-dim); font-size:14px; letter-spacing:3px; text-transform:uppercase;}
  .tap-hint{margin-top:30px; font-size:13px; color:var(--text-dim2); animation:floaty 2.4s ease-in-out infinite;}

  /* AUTH / ONBOARDING */
  .center-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; position:relative; overflow:hidden;}
  .auth-blob{position:absolute; border-radius:50%; filter:blur(60px); opacity:.35; pointer-events:none; z-index:0;}
  .auth-blob.b1{width:220px; height:220px; background:var(--blue); top:-40px; left:-60px; animation:floaty 7s ease-in-out infinite;}
  .auth-blob.b2{width:260px; height:260px; background:var(--blue2); bottom:-70px; right:-70px; animation:floaty 8s ease-in-out .8s infinite;}
  .auth-wordmark{font-family:'Fraunces',serif; position:relative; z-index:1; font-size:30px; font-weight:700; letter-spacing:-.5px; margin-bottom:18px;
    background:linear-gradient(90deg, #ff8fc4, #ff5fa8, #9fe8ff, #ff5fa8); background-size:200% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shimmerText 4s linear infinite; filter:drop-shadow(0 0 18px rgba(255,95,168,.4));}
  .auth-card{position:relative; z-index:1; width:100%; max-width:360px; padding:2px; border-radius:calc(var(--radius) + 2px);
    background:linear-gradient(140deg, var(--blue), transparent 30%, transparent 70%, var(--blue2)); animation:popIn .4s ease both;}
  .auth-card>.auth-inner{background:linear-gradient(180deg, rgba(10,8,20,.92), rgba(10,8,20,.85)); backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px); border-radius:calc(var(--radius) + 1px); padding:28px 24px; display:flex; flex-direction:column; gap:14px;}
  .auth-card h2{margin:0 0 2px; font-size:22px;}
  .auth-card p.sub{margin:0 0 10px; color:var(--text-dim); font-size:13.5px;}
  .switch-line{text-align:center; font-size:13px; color:var(--text-dim); margin-top:4px;}
  .switch-line span{color:var(--blue); cursor:pointer; font-weight:600;}
  .err-msg{color:var(--danger); font-size:13px; min-height:16px;}
  .country-select-list{display:flex; flex-wrap:wrap; gap:8px; max-height:170px; overflow-y:auto; padding:4px 2px;}
  .country-chip{padding:8px 12px; border-radius:12px; border:1px solid var(--border); background:rgba(255,255,255,.04);
    font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px; transition:.15s;}
  .country-chip:hover{background:rgba(255,95,168,.14); transform:translateY(-1px);}
  .country-chip.active{background:linear-gradient(135deg, var(--blue), var(--blue2)); border-color:transparent;}

  /* MENU */
  #screen-menu{padding:26px 20px; gap:18px;}
  .menu-top{display:flex; align-items:center; justify-content:space-between;}
  .menu-top .hello{font-size:13px; color:var(--text-dim);}
  .menu-top .uname{font-size:19px; font-weight:700;}
  .points-badge{font-family:'JetBrains Mono',monospace; background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:7px 14px;
    font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px;}
  .menu-grid{display:flex; flex-direction:column; gap:14px; margin-top:6px; overflow-y:auto;}

/* ============ COUNTDOWN HELPERS ============ */
function msRemaining(){ if(!APP.user || !APP.user.spiderEventEndsAt) return null; return Math.max(0, APP.user.spiderEventEndsAt - Date.now()); }
function formatCountdown(ms){
  if(ms==null) return '';
  const s = Math.floor(ms/1000);
  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return `${d}d ${h}h ${m}m ${sec}s`;
}
function formatHMS(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return `${h}h ${m}m ${sec}s`;
}
function startLiveCountdownTicker(){
  if(APP.countdownInterval){ clearInterval(APP.countdownInterval); APP.countdownInterval=null; }
  const tick = ()=>{
    document.querySelectorAll('.live-countdown[data-target]').forEach(el=>{
      const target = parseInt(el.dataset.target,10);
      const rem = target - Date.now();
      const ready = el.dataset.ready || '';
      const prefix = el.dataset.prefix || '';
      el.textContent = rem>0 ? (prefix+formatCountdown(rem)) : ready;
    });
  };
  tick();
  APP.countdownInterval = setInterval(tick, 1000);
}

const FIRESTORE_BASE = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents`;

function showDebugToast(msg){
  console.error('[Firestore]', msg);
  const toast = document.createElement('div');
  toast.className = 'saved-toast';
  toast.style.background = 'var(--danger)';
  toast.style.maxWidth = '88%';
  toast.style.fontSize = '11px';
  toast.style.lineHeight = '1.4';
  toast.style.zIndex = '999';
  toast.textContent = '⚠️ DB: ' + msg;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 6000);
}
async function firestoreGet(collection, docId){
  try{
    const res = await fetch(`${FIRESTORE_BASE}/${collection}/${encodeURIComponent(docId)}?key=${firebaseConfig.apiKey}`);
    if(res.status===404) return null;
    if(!res.ok){ const t = await res.text().catch(()=>''); showDebugToast('GET '+res.status+' '+t.slice(0,140)); return null; }
    const data = await res.json();
    if(!data.fields || !data.fields.data) return null;
    return JSON.parse(data.fields.data.stringValue);
  }catch(e){ showDebugToast('GET fallo: '+(e&&e.message||e)); return null; }
}
async function firestoreSet(collection, docId, obj){
  try{
    const res = await fetch(`${FIRESTORE_BASE}/${collection}/${encodeURIComponent(docId)}?key=${firebaseConfig.apiKey}`, {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ fields: { data: { stringValue: JSON.stringify(obj) } } })
    });
    if(!res.ok){ const t = await res.text().catch(()=>''); showDebugToast('SET '+res.status+' '+t.slice(0,140)); }
  }catch(e){ showDebugToast('SET fallo: '+(e&&e.message||e)); }
}
async function firestoreDelete(collection, docId){
  try{
    const res = await fetch(`${FIRESTORE_BASE}/${collection}/${encodeURIComponent(docId)}?key=${firebaseConfig.apiKey}`, {method:'DELETE'});
    if(!res.ok){ const t = await res.text().catch(()=>''); showDebugToast('DEL '+res.status+' '+t.slice(0,140)); }
  }catch(e){ showDebugToast('DEL fallo: '+(e&&e.message||e)); }
}
async function firestoreList(collection){
  try{
    let docs = [], pageToken = null;
    do{
      const url = `${FIRESTORE_BASE}/${collection}?key=${firebaseConfig.apiKey}&pageSize=300` + (pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : '');
      const res = await fetch(url);
      if(!res.ok){ const t = await res.text().catch(()=>''); showDebugToast('LIST '+res.status+' '+t.slice(0,140)); return docs.map(d=>{ try{ return JSON.parse(d.fields.data.stringValue); }catch(e){ return null; } }).filter(Boolean); }
      const data = await res.json();
      docs = docs.concat(data.documents || []);
      pageToken = data.nextPageToken || null;
    } while(pageToken);
    return docs.map(d=>{ try{ return JSON.parse(d.fields.data.stringValue); }catch(e){ return null; } }).filter(Boolean);
  }catch(e){ showDebugToast('LIST fallo: '+(e&&e.message||e)); return []; }
}

async function sha256Hex(str){
  try{
    const enc = new TextEncoder().encode(str);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=0; for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i))|0; }
    return 'fb'+(h>>>0).toString(16);
  }
}

/* ============ STARFIELD ============ */
(function starfield(){
  const cvs = document.getElementById('stars'); const ctx = cvs.getContext('2d'); let stars = [];
  function resize(){
    cvs.width = window.innerWidth; cvs.height = window.innerHeight; stars = [];
    const n = Math.floor((cvs.width*cvs.height)/9000);
    for(let i=0;i<n;i++){ stars.push({x:Math.random()*cvs.width, y:Math.random()*cvs.height, r:Math.random()*1.4+0.3,
      speed:Math.random()*0.015+0.003, phase:Math.random()*Math.PI*2}); }
  }
  window.addEventListener('resize', resize); resize();
  function loop(t){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const g = ctx.createRadialGradient(cvs.width*0.5,cvs.height*0.15,0,cvs.width*0.5,cvs.height*0.15,cvs.width*0.9);
    g.addColorStop(0,THEME_GLOW); g.addColorStop(1,'rgba(3,5,11,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,cvs.width,cvs.height);
    for(const s of stars){ const tw = 0.5 + 0.5*Math.sin(t*s.speed + s.phase);
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fillStyle = `rgba(190,215,255,${0.25+tw*0.65})`; ctx.fill(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

function stampTeamBadge(imgDataUrl, teamName){
  return new Promise((resolve)=>{
    if(!imgDataUrl){ resolve(imgDataUrl); return; }
    const img = new Image();
    img.onload = function(){
      try{
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const bandH = Math.max(30, Math.round(img.height*0.15));
        const grad = ctx.createLinearGradient(0, img.height-bandH, img.width, img.height);
        grad.addColorStop(0, '#ff2ea6'); grad.addColorStop(1, '#5fd4ff');
        ctx.fillStyle = grad;
        ctx.fillRect(0, img.height-bandH, img.width, bandH);
        ctx.fillStyle = '#0a0612';
        ctx.font = `bold ${Math.max(12, Math.round(bandH*0.4))}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(`🏆 EQUIPO COMPLETO · ${teamName.toUpperCase()}`, img.width/2, img.height-bandH/2);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      }catch(e){ resolve(imgDataUrl); }
    };
    img.onerror = ()=> resolve(imgDataUrl);
    img.src = imgDataUrl;
  });
}

function resizeDataUrl(img, maxDim, quality){
  let w = img.width, h = img.height;
  if(w>h && w>maxDim){ h = h*(maxDim/w); w = maxDim; } else if(h>=w && h>maxDim){ w = w*(maxDim/h); h = maxDim; }
  const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
  canvas.getContext('2d').drawImage(img,0,0,w,h);
  return canvas.toDataURL('image/jpeg', quality);
}

function onFileChosen(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const dataUrl = resizeDataUrl(img, 800, 0.85);
      const thumbUrl = resizeDataUrl(img, 260, 0.72);
      APP.scanImageData = dataUrl;
      APP.scanThumbData = thumbUrl;
      renderScanPreConfirm(dataUrl, thumbUrl);

  e.target.value = '';
}

/* ============ UBICACIÓN REAL (rareza según país real del usuario) ============ */
async function resolveUserCountry(){
  if(APP.userLocationCountry !== undefined) return APP.userLocationCountry;
  if(!navigator.geolocation){ APP.userLocationCountry = null; return null; }
  try{
    const pos = await new Promise((resolve, reject)=>{
      navigator.geolocation.getCurrentPosition(resolve, reject, {timeout:8000, maximumAge:600000});
    });
    const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&localityLanguage=es`);
    const data = await res.json();
    APP.userLocationCountry = { name: data.countryName || null, iso: (data.countryCode||'').toUpperCase() || null, city: data.city || data.locality || null };
    return APP.userLocationCountry;
  }catch(e){
    APP.userLocationCountry = null;
    return null;
  }
}

function startScanning(dataUrl, thumbUrl, userNote){
  const lang = APP.user.lang;
  const L=(k)=>tr(lang,k);
  const area = document.getElementById('scanArea');
  const effectId = (APP.user.equipped&&APP.user.equipped.loading)||'dots';
  area.innerHTML = `<div class="scan-preview-wrap">
      <img src="${dataUrl}">
      <div class="scan-overlay">${scanOverlayEffectHtml(effectId)}<div>${L('scanningMsg')}</div>
        <div style="margin-top:2px;">${loadingIndicatorHtml(effectId)}</div>
      </div>
    </div>`;
  resolveUserCountry().then(loc=>{
    identifyObject(dataUrl, lang, userNote, loc).then(result=>{
      if(!result || result.identified===false){
        renderScanFail(lang, result && result.message);
      } else {
        saveScannedObject(result, lang, thumbUrl);
      }
    }).catch((err)=>{ renderScanLimitReached(lang, err && err.status===429); });
  });
}

async function saveScannedObject(result, lang, thumbUrl){
  const L=(k)=>tr(lang,k);
  const cat = categoryById(APP.scanCategory);
  const nameKey = (result.name||'').trim().toLowerCase();
  const existing = APP.objects.find(o=> o.catId===cat.id && (o.name||'').trim().toLowerCase()===nameKey && nameKey);
  const r = rarityMeta(existing ? existing.rarityId : result.rarity, lang);
  const obj = {
    id: 'o'+Date.now()+Math.floor(Math.random()*1000),
    name: result.name || '???',
    category: result.category || '',
    rarityId: r.id,
    countryIso: (existing ? existing.countryIso : (result.countryIso && countryByIso(result.countryIso) ? result.countryIso : null)),
    curiosity: existing ? existing.curiosity : (result.curiosity || ''),
    image: thumbUrl || null,
    isSpider: !!result.isSpider,
    isBackrooms: !!result.isBackrooms,
    catId: cat.id,
    scanCity: (APP.userLocationCountry && APP.userLocationCountry.city) || null,
    scanCountryIso: (APP.userLocationCountry && APP.userLocationCountry.iso) || null,
    ts: Date.now()
  };
  APP.objects.push(obj);
  APP.user.points = (APP.user.points||0) + r.points;
  await saveObjects(APP.user.username, APP.objects);
  let triggeredSpider = false, triggeredBackrooms = false;
  if(obj.isSpider && !(APP.user.claimedMissions||[]).includes('spider_hunt')){
    triggeredSpider = true;
    APP.user.claimedMissions.push('spider_hunt');
    APP.user.points += 250;
    if(!APP.user.ownedLoadings.includes('webslinger')) APP.user.ownedLoadings.push('webslinger');
    APP.user.spiderEventEndsAt = Date.now() + ((15*86400)+(13*3600)+(40*60)+32)*1000;
  }
  if(obj.isBackrooms && !(APP.user.claimedMissions||[]).includes('backrooms_hunt')){
    triggeredBackrooms = true;
    APP.user.claimedMissions.push('backrooms_hunt');
    APP.user.points += 300;
    if(!APP.user.ownedChatbgs.includes('yellowroom')) APP.user.ownedChatbgs.push('yellowroom');
    APP.user.backroomsEventEndsAt = Date.now() + ((15*86400)+(1*3600)+(4*60)+23)*1000;
  }
  await saveAccount(APP.user);
  await checkChallengeProgress();
  let teamUnlock = null;
  if(cat.id==='deportes' && result.team && TEAM_REQUIRED_ITEMS.includes(result.sportItem)){
    const key = String(result.team).trim();
    if(key){
      APP.user.teamProgress = APP.user.teamProgress || {};
      const set = new Set(APP.user.teamProgress[key] || []);
      set.add(result.sportItem);
      APP.user.teamProgress[key] = Array.from(set);
      APP.user.completedTeams = APP.user.completedTeams || [];
      if(set.size >= TEAM_REQUIRED_ITEMS.length && !APP.user.completedTeams.includes(key)){
        APP.user.completedTeams.push(key);
        const badgeImg = await stampTeamBadge(thumbUrl, key);
        const trophyObj = {
          id: 'ot'+Date.now()+Math.floor(Math.random()*1000),
          name: (lang==='en' ? `Complete Team: ${key}` : `Equipo Completo: ${key}`),
          category: 'Deporte',
          rarityId: 'exclusiva',
          countryIso: null,
          curiosity: lang==='en' ? `You collected all 6 items of ${key}! An exclusive trophy for true fans.` : `¡Has reunido los 6 objetos de ${key}! Un trofeo exclusivo para verdaderos aficionados.`,
          image: badgeImg,
          isSpider:false, isBackrooms:false,
          catId: 'deportes', ts: Date.now(),
          isTeamTrophy: true
        };
        APP.objects.push(trophyObj);
        APP.user.points = (APP.user.points||0) + RARITIES.exclusiva.points;
        await saveObjects(APP.user.username, APP.objects);
        teamUnlock = {team:key, image:badgeImg, points:RARITIES.exclusiva.points};
      }
      await saveAccount(APP.user);
    }
  }
  renderScanReveal(obj, lang, triggeredSpider, triggeredBackrooms, teamUnlock);
}

function renderScanReveal(obj, lang, triggeredSpider, triggeredBackrooms, teamUnlock){
  const L=(k)=>tr(lang,k);
  const r = rarityMeta(obj.rarityId, lang);
  vibrateForRarity(obj.rarityId);
  const sparkCount = r.points>=150 ? 10 : (r.points>=60?6:0);
  let sparks = '';
  for(let i=0;i<sparkCount;i++){
    const angle = (i/sparkCount)*Math.PI*2; const dist = 70+Math.random()*40;
    sparks += `<span class="spark" style="--sx:${Math.cos(angle)*dist}px; --sy:${Math.sin(angle)*dist}px; animation-delay:${i*40}ms;"></span>`;

const GROQ_API_KEY = "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";
const GROQ_TEXT_MODEL = "openai/gpt-oss-120b";
const GROQ_VISION_MODEL = "qwen/qwen3.6-27b";
const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
async function callGroq(model, messages){
  let response;
  try{
    response = await fetch(GROQ_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json", "Authorization": "Bearer " + GROQ_API_KEY},
      body: JSON.stringify({ model, messages })
    });
  }catch(e){
    showDebugToast('Groq fetch fallo: '+(e&&e.message||e));
    throw e;
  }
  const data = await response.json().catch(()=>({}));
  if(!response.ok || data.error){
    const msg = (data.error && (data.error.message||data.error.code)) || (response.status+' '+response.statusText);
    showDebugToast('Groq '+response.status+': '+String(msg).slice(0,160));
    const err = new Error('api_error');
    err.status = response.status;
    throw err;
  }
  const choice = data.choices && data.choices[0];
  const text = choice && choice.message && choice.message.content;
  if(text==null){
    showDebugToast('Groq: sin contenido en la respuesta');
    throw new Error('no_content');
  }
  return text;
}

${categoryRule}${sportRule}${noteRule}${locationRule}
Responde ÚNICAMENTE con un JSON válido, sin texto fuera del JSON, sin backticks. Cuando identified sea true usa este formato:
{"identified":true,"name":"nombre corto del objeto","category":"una categoría breve (Accesorio, Comida, Tecnología, Ropa, Naturaleza, Hogar, Juguete, Herramienta, Vehículo, Arte, Deporte, Música, Otro)","rarity":"uno de estos valores exactos: comun, poco_comun, raro, epico, legendario, mitico, prohibido, vip","countryIso":"código ISO2 de un país si el objeto está claramente asociado a una cultura o país concreto (ej. paella -> ES), o null si no tiene país claro","curiosity":"una frase curiosa, breve y entretenida sobre el objeto o su rareza, en tono de juego","isSpider":false,"isBackrooms":false}

El campo "isBackrooms" debe ser true si la foto muestra una escena de una pantalla (televisión, proyector de cine, monitor) reproduciendo algo con estética "Backrooms" (espacio liminal, pasillos o habitaciones vacías de color amarillo con luz fluorescente parpadeante) y false en cualquier otro caso.

CÓMO ASIGNAR LA RAREZA — piensa en TRES ejes, no solo en "qué tan común es el objeto físico":

Responde los textos (name, category, curiosity, message) en el idioma: ${langName}.`;
  const messages = [
    { role:"system", content: sys },
    { role:"user", content:[
      { type:"text", text: userNote && userNote.trim() ? `Identifica este objeto y clasifícalo según las instrucciones. Información extra del usuario: ${userNote.trim().slice(0,300)}` : "Identifica este objeto y clasifícalo según las instrucciones." },

  APP.messages.filter(m=>m.kind==='text').slice(-10).forEach(m=> messages.push({role: m.role==='user'?'user':'assistant', content: m.text}));
  messages.push({role:'user', content: userText});
  const raw0 = await callGroq(GROQ_TEXT_MODEL, messages);
  const raw = raw0.replace(/<think>[\s\S]*?<\/think>/gi,'').replace(/<think>[\s\S]*/gi,'').trim().replace(/^```json/,'').replace(/^```/,'').replace(/```$/,'').trim();

}

function shopItemCard(kind, item, lang, previewHtml){
  const ownedKey = ownedKeyFor(kind);
  const owned = (APP.user[ownedKey]||[]).includes(item.id);
  const equippedId = (APP.user.equipped||{})[kind];
  const isEquipped = equippedId===item.id;
  const label = item.name[lang]||item.name.es;
  const exclusiveLabel = lang==='en'?'Mission exclusive':lang==='fr'?'Exclusif de mission':lang==='it'?'Esclusivo di missione':lang==='de'?'Missionsexklusiv':lang==='pt'?'Exclusivo de missão':'Exclusivo de misión';
  const stateLabel = isEquipped? (lang==='en'?'Equipped':'Equipado') : owned? (lang==='en'?'Owned':'Adquirido') : (item.exclusive? ('🔒 '+exclusiveLabel) : (item.cost+' pts'));
  return `<div class="shop-item glass ${isEquipped?'equipped':''}" data-kind="${kind}" data-id="${item.id}" data-cost="${item.cost||0}" data-exclusive="${item.exclusive?1:0}">
    <div class="shop-preview">${previewHtml}</div>
    <div class="shop-name">${escapeHtml(label)}</div>
    <div class="shop-state ${isEquipped?'is-equipped':owned?'is-owned':''}">${stateLabel}</div>
  </div>`;
}
async function shopSelect(kind, id, cost){
  const ownedKey = ownedKeyFor(kind);
  const owned = APP.user[ownedKey] || [];
  if(!owned.includes(id)){
    if((APP.user.points||0) < cost){
      const toast = document.createElement('div'); toast.className='saved-toast';
      toast.style.background = 'var(--danger)';
      toast.textContent = APP.user.lang==='en' ? 'Not enough points' : 'Puntos insuficientes';
      document.body.appendChild(toast); setTimeout(()=>toast.remove(), 1600);
      return;
    }
    APP.user.points -= cost; owned.push(id); APP.user[ownedKey] = owned;
  }
  APP.user.equipped[kind] = id;
  await saveAccount(APP.user);
  applyEquipped();
  render();
}
const SHOP_SECTIONS = [
 {kind:'loading', icon:'⏳', labelKey:'loading', items:()=>LOADING_EFFECTS, previewFn:(le)=>`<div class="shop-load-preview">${loadingIndicatorHtml(le.id)}</div>`}
];
function shopLabels(lang){
  return {
    theme: lang==='en'?'App theme':lang==='fr'?'Thème de l\'appli':lang==='it'?'Tema dell\'app':lang==='de'?'App-Design':lang==='pt'?'Tema do app':'Tema de la app',
    bubble: lang==='en'?'Chat color':lang==='fr'?'Couleur du chat':lang==='it'?'Colore chat':lang==='de'?'Chat-Farbe':lang==='pt'?'Cor do chat':'Color del chat',
    loading: lang==='en'?'AI loading effect':lang==='fr'?'Effet de chargement IA':lang==='it'?'Effetto di caricamento IA':lang==='de'?'KI-Ladeeffekt':lang==='pt'?'Efeito de carregamento da IA':'Efecto de carga de la IA',
    bg: lang==='en'?'Chat background':lang==='fr'?'Fond du chat':lang==='it'?'Sfondo chat':lang==='de'?'Chat-Hintergrund':lang==='pt'?'Fundo do chat':'Fondo del chat',
    frame: lang==='en'?'Profile frame':lang==='fr'?'Cadre de profil':lang==='it'?'Cornice profilo':lang==='de'?'Profilrahmen':lang==='pt'?'Moldura de perfil':'Marco de perfil',
    lbbg: lang==='en'?'Leaderboard background':lang==='fr'?'Fond du classement':lang==='it'?'Sfondo classifica':lang==='de'?'Ranglisten-Hintergrund':lang==='pt'?'Fundo do ranking':'Fondo del ranking',
    explore: lang==='en'?'Explore':lang==='fr'?'Explorer':lang==='it'?'Esplora':lang==='de'?'Entdecken':lang==='pt'?'Explorar':'Explorar'
  };
}
function renderShop(lang){
  const L=(k)=>tr(lang,k);
  const T = shopLabels(lang);
  const cards = SHOP_SECTIONS.map(sec=>{
    const list = sec.items();
    const ownedKey = ownedKeyFor(sec.kind);
    const ownedCount = (APP.user[ownedKey]||[]).length;
    const pct = list.length ? Math.min(100, Math.round((ownedCount/list.length)*100)) : 0;
    return `<div class="hub-item glass" data-shopcat="${sec.kind}" style="flex-direction:column; align-items:stretch;">
      <div style="display:flex; align-items:center; gap:16px;">
        <div class="ic">${sec.icon}</div>
        <div class="txt" style="flex:1;"><h3>${T[sec.labelKey]}</h3><p>${ownedCount}/${list.length} · ${T.explore} →</p></div>
      </div>
      <div style="height:5px; border-radius:4px; background:rgba(255,255,255,.08); margin-top:12px; overflow:hidden;">
        <div style="height:100%; width:${pct}%; border-radius:4px; background:linear-gradient(90deg, var(--blue), var(--blue2));"></div>
      </div>
    </div>`;
  }).join('');
  app.innerHTML = `<div class="screen" id="screen-shop">
    <div class="top-bar"><span class="back" id="shopBack">‹</span><h2>${L('menuShopTitle')}</h2><span class="points-badge" style="margin-left:auto;">✦ ${APP.user.points||0}</span></div>
    <div class="hub-grid">${cards}</div>
  </div>`;
  document.getElementById('shopBack').onclick = ()=> go('menu');
  document.querySelectorAll('#screen-shop [data-shopcat]').forEach(el=>{
    el.onclick = ()=>{ APP.shopCategory = el.dataset.shopcat; go('shopCategory'); };
  });
}
function renderShopCategoryScreen(lang){
  const T = shopLabels(lang);
  const sec = SHOP_SECTIONS.find(s=>s.kind===APP.shopCategory) || SHOP_SECTIONS[0];
  const grid = sec.items().map(item=> shopItemCard(sec.kind, item, lang, sec.previewFn(item))).join('');
  app.innerHTML = `<div class="screen" id="screen-shop">
    <div class="top-bar"><span class="back" id="shopCatBack">‹</span><h2>${sec.icon} ${T[sec.labelKey]}</h2><span class="points-badge" style="margin-left:auto;">✦ ${APP.user.points||0}</span></div>
    <div class="shop-scroll"><div class="shop-grid">${grid}</div></div>
  </div>`;
  document.getElementById('shopCatBack').onclick = ()=> go('shop');
  document.querySelectorAll('#screen-shop .shop-item').forEach(el=>{
    el.onclick = ()=>{
      const kind = el.dataset.kind, id = el.dataset.id, cost = parseInt(el.dataset.cost,10)||0, excl = el.dataset.exclusive==='1';
      const ownedKey = ownedKeyFor(kind);
      const owned = (APP.user[ownedKey]||[]).includes(id);
      if(excl && !owned){
        const toast = document.createElement('div'); toast.className='saved-toast';
        toast.textContent = lang==='en' ? 'Complete the special spider mission to unlock it 🕷️' : 'Completa la misión especial de la araña para desbloquearlo 🕷️';
        document.body.appendChild(toast); setTimeout(()=>toast.remove(), 2200);
        return;
      }
      shopSelect(kind, id, cost);
    };
  });
}

async function openPlayerProfileModal(username, lang){
  const T = playersT(lang); const FT = friendsT(lang);
  const backdrop = document.createElement('div');
  backdrop.className = 'preview-backdrop';
  backdrop.innerHTML = `<div class="preview-modal glass" style="max-width:360px; text-align:left;"><div class="loading-mini">${T.loading}</div></div>`;
  document.body.appendChild(backdrop);
  const close = ()=> backdrop.remove();
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) close(); });
  const p = await firestoreGet('publicProfiles', username);
  const modal = backdrop.querySelector('.preview-modal');
  if(!p){ modal.innerHTML = `<span class="preview-close">✕</span><div class="player-notfound">${T.notFound}</div>`; modal.querySelector('.preview-close').onclick = close; return; }
  const isSelf = p.username===APP.user.username;
  const myFriends = isSelf ? [] : await loadFriendsList(APP.user.username);
  const isFriend = myFriends.includes(p.username);
  const online = isRecentlyActive(p.lastActive);
  const onlineLbl = online ? (lang==='en'?'Online':'En línea') : (lang==='en'?'Offline':'Desconectado');
  modal.innerHTML = `<span class="preview-close">✕</span>
    <div style="display:flex; align-items:center; gap:6px; margin-bottom:2px;">${onlineDotHtml(online)}<span style="font-size:11.5px; color:var(--text-dim);">${onlineLbl}</span></div>
    ${playerCardHtml(p, lang, T, isSelf)}
    ${(!isSelf) ? `<div style="display:flex; gap:8px; margin-top:10px;">
        <button class="btn ${isFriend?'ghost':'primary'} small" id="modalAddFriendBtn" style="flex:1;" ${isFriend?'disabled':''}>${isFriend?FT.alreadyFriends:FT.add}</button>
        <button class="btn ghost small" id="modalChallengeBtn" style="flex:1;">⚔️ ${FT.challenge}</button>
      </div>
      <div id="modalChallengePicker"></div>` : ''}`;
  modal.querySelector('.preview-close').onclick = close;
  if(!isSelf){
    const addBtn = modal.querySelector('#modalAddFriendBtn');
    if(addBtn && !isFriend){
      addBtn.onclick = async ()=>{
        await sendFriendRequest(p.username, APP.user.name||APP.user.username);
        addBtn.textContent = FT.requested; addBtn.disabled = true; addBtn.classList.remove('primary'); addBtn.classList.add('ghost');
      };
    }
    const chBtn = modal.querySelector('#modalChallengeBtn');
    if(chBtn){
      chBtn.onclick = ()=>{
        const pickerEl = modal.querySelector('#modalChallengePicker');
        if(pickerEl.dataset.open==='1'){ pickerEl.innerHTML=''; pickerEl.dataset.open='0'; return; }
        pickerEl.dataset.open='1';
        pickerEl.innerHTML = CHALLENGE_TYPES.map(t=>`<button class="btn ghost small" data-picktype="${t.id}" style="width:100%; margin-top:6px; text-align:left;">${t.label[lang]||t.label.es} (+${t.reward} pts)</button>`).join('');
        pickerEl.querySelectorAll('[data-picktype]').forEach(tb=>{
          tb.onclick = async ()=>{
            await sendChallengeInvite(p.username, p.name||p.username, tb.dataset.picktype);
            pickerEl.innerHTML = `<div class="gift-msg" style="color:#7be0a0;">${FT.requested}</div>`;
          };
        });
      };
    }
    if(p.collectionPublic){
      const spyBtn = modal.querySelector('#spyBtn');
      if(spyBtn) spyBtn.onclick = async ()=>{
        const spyEl = modal.querySelector('#spyGrid');
        if(spyEl.dataset.open==='1'){ spyEl.innerHTML=''; spyEl.dataset.open='0'; return; }
        spyEl.dataset.open='1';
        spyEl.innerHTML = `<div class="loading-mini">${T.loading}</div>`;
        const d = await firestoreGet('publicCollections', p.username);
        const list = (d && d.list) || [];
        if(!list.length){ spyEl.innerHTML = `<div class="player-notfound">${T.noPlayers}</div>`; return; }
        spyEl.innerHTML = `<div class="gift-obj-grid">${list.map(o=>objPhotoCardHtml(o,lang)).join('')}</div>`;
        spyEl.querySelectorAll('[data-objid]').forEach(el=>{
          el.onclick = ()=>{ const obj = list.find(x=>x.id===el.dataset.objid); if(obj) showPreview(obj, lang); };
        });
      };
    }
    const giftBtn = modal.querySelector('#giftBtn');
    if(giftBtn) giftBtn.onclick = async ()=>{
      const amt = parseInt(modal.querySelector('#giftAmount').value,10);
      const msgEl = modal.querySelector('#giftMsg');
      if(!amt || amt<=0){ msgEl.textContent = T.giftInvalid; return; }
      if((APP.user.points||0) < amt){ msgEl.textContent = T.giftNotEnough; return; }
      APP.user.points -= amt;
      await saveAccount(APP.user);
      await sendGift(p.username, amt, APP.user.name||APP.user.username);
      msgEl.textContent = T.giftSent; msgEl.style.color = '#7be0a0';
    };
    const giftObjBtn = modal.querySelector('#giftObjBtn');
    if(giftObjBtn) giftObjBtn.onclick = ()=>{
      const pickerEl = modal.querySelector('#giftObjPicker');
      if(pickerEl.dataset.open==='1'){ pickerEl.innerHTML=''; pickerEl.dataset.open='0'; return; }
      pickerEl.dataset.open='1';
      if(!APP.objects.length){ pickerEl.innerHTML = `<div class="gift-msg">${T.noObjects}</div>`; return; }
      pickerEl.innerHTML = `<div class="gift-obj-grid">${APP.objects.map(o=>objPhotoCardHtml(o,lang)).join('')}</div>`;
      pickerEl.querySelectorAll('[data-objid]').forEach(el=>{
        el.onclick = async ()=>{
          const obj = APP.objects.find(x=>x.id===el.dataset.objid);
          if(!obj) return;
          if(!confirm(T.giftObjConfirm.replace('{name}', obj.name))) return;
          APP.objects = APP.objects.filter(x=>x.id!==obj.id);
          await saveObjects(APP.user.username, APP.objects);
          await saveAccount(APP.user);
          await sendObjectGift(p.username, obj, APP.user.name||APP.user.username);
          pickerEl.innerHTML = `<div class="gift-msg" style="color:#7be0a0;">${T.giftSent}</div>`;
        };
      });
    };
  }
}
function playerCardHtml(p, lang, T, isSelf){
  const r = p.topRarityId ? rarityMeta(p.topRarityId, lang) : null;
  const t = p.title ? titleById(p.title) : null;
  const featured = p.featured||[];
  const showcaseHtml = featured.length ? `<div class="showcase-grid mini">${featured.map(o=>{
    const fr = rarityMeta(o.rarityId, lang);
    return `<div class="obj-photo-card rarity-${fr.id}" style="--rc:${fr.color}">${o.image?`<img src="${o.image}">`:`<div class="obj-emoji-big">${categoryEmoji(o.category)}</div>`}<div class="obj-photo-name">${escapeHtml(o.name)}</div></div>`;
  }).join('')}</div>` : '';
  return `<div class="player-card glass">
    ${frameWrapName(`<b>${escapeHtml(p.name||p.username)}</b>`, p.frame||'none')}
    ${t ? `<div class="player-title-tag">${t.name[lang]||t.name.es}</div>` : ''}
    <div class="player-points">✦ ${p.points||0} pts</div>
    <div class="player-meta">${T.objectsLabel}: ${p.objectCount||0}${r? ` · ${T.topRarityLabel}: <span style="color:${r.color}">${r.label}</span>`:''}</div>
    ${showcaseHtml}
    ${p.collectionPublic ? `<button class="btn ghost small" id="spyBtn" style="margin-top:8px;">🕵️ ${T.spyBtn}</button><div id="spyGrid"></div>` : ''}
    ${!isSelf ? `<div class="gift-form"><input class="field" id="giftAmount" type="number" min="1" placeholder="${T.giftPh}"><button class="btn primary small" id="giftBtn">🎁</button></div><div class="gift-msg" id="giftMsg"></div>
    <button class="btn ghost small" id="giftObjBtn" style="margin-top:8px;">📦 ${T.giftObjBtn}</button><div id="giftObjPicker"></div>` : ''}
  </div>`;
}
function renderPlayers(lang){
  const T = playersT(lang);
  app.innerHTML = `<div class="screen" id="screen-players">
     <div class="top-bar"><span class="back" id="playersBack">‹</span><h2>${T.title}</h2></div>
     <div class="player-search"><input class="field" id="playerSearchInput" placeholder="${T.searchPh}"><button class="btn primary small" id="playerSearchBtn">🔍</button></div>
     <div id="playerResult"></div>
     <div class="wi-section-title">${T.leaderboard}</div>
     <div id="leaderboardList" class="leaderboard-list"><div class="loading-mini">${T.loading}</div></div>
   </div>`;
  document.getElementById('playersBack').onclick = ()=> go('menu');
  async function doSearch(){
    const uname = document.getElementById('playerSearchInput').value.trim().toLowerCase().replace(/[^a-z0-9_.-]/g,'');
    const resultEl = document.getElementById('playerResult');
    if(!uname) return;
    resultEl.innerHTML = `<div class="loading-mini">${T.loading}</div>`;
    try{
      const p = await firestoreGet('publicProfiles', uname);
      if(!p){ resultEl.innerHTML = `<div class="player-notfound">${T.notFound}</div>`; return; }
      if(!Array.isArray(p.featured)) showDebugToast('Perfil público: featured no es un array válido ('+typeof p.featured+')');
      if(p.collectionPublic===undefined) showDebugToast('Perfil público: falta el campo collectionPublic');
      const isSelf = p.username===APP.user.username;
      resultEl.innerHTML = playerCardHtml(p, lang, T, isSelf);
      if(p.collectionPublic){
        document.getElementById('spyBtn').onclick = async ()=>{
          const spyEl = document.getElementById('spyGrid');
          if(spyEl.dataset.open==='1'){ spyEl.innerHTML=''; spyEl.dataset.open='0'; return; }
          spyEl.dataset.open='1';
          spyEl.innerHTML = `<div class="loading-mini">${T.loading}</div>`;
          const d = await firestoreGet('publicCollections', p.username);
          if(!d) showDebugToast('publicCollections no existe para '+p.username+' — activó público pero nunca se publicó la colección');
          const list = (d && d.list) || [];
          if(!list.length){ spyEl.innerHTML = `<div class="player-notfound">${T.noPlayers}</div>`; return; }
          spyEl.innerHTML = `<div class="gift-obj-grid">${list.map(o=>objPhotoCardHtml(o,lang)).join('')}</div>`;
          spyEl.querySelectorAll('[data-objid]').forEach(el=>{
            el.onclick = ()=>{ const obj = list.find(x=>x.id===el.dataset.objid); if(obj) showPreview(obj, lang); };
          });
        };
      }
      if(!isSelf){
        document.getElementById('giftBtn').onclick = async ()=>{
          const amt = parseInt(document.getElementById('giftAmount').value,10);
          const msgEl = document.getElementById('giftMsg');
          if(!amt || amt<=0){ msgEl.textContent = T.giftInvalid; msgEl.style.color=''; return; }
          if((APP.user.points||0) < amt){ msgEl.textContent = T.giftNotEnough; msgEl.style.color=''; return; }
          APP.user.points -= amt;
          await saveAccount(APP.user);
          await sendGift(p.username, amt, APP.user.name||APP.user.username);
          msgEl.textContent = T.giftSent; msgEl.style.color = '#7be0a0';
        };
        document.getElementById('giftObjBtn').onclick = ()=>{
          const pickerEl = document.getElementById('giftObjPicker');
          if(pickerEl.dataset.open==='1'){ pickerEl.innerHTML=''; pickerEl.dataset.open='0'; return; }
          pickerEl.dataset.open='1';
          if(!APP.objects.length){ pickerEl.innerHTML = `<div class="gift-msg">${T.noObjects}</div>`; return; }
          pickerEl.innerHTML = `<div class="gift-obj-grid">${APP.objects.map(o=>objPhotoCardHtml(o,lang)).join('')}</div>`;
          pickerEl.querySelectorAll('[data-objid]').forEach(el=>{
            el.onclick = async ()=>{
              const obj = APP.objects.find(x=>x.id===el.dataset.objid);
              if(!obj) return;
              if(!confirm(T.giftObjConfirm.replace('{name}', obj.name))) return;
              APP.objects = APP.objects.filter(x=>x.id!==obj.id);
              await saveObjects(APP.user.username, APP.objects);
              await saveAccount(APP.user);
              await sendObjectGift(p.username, obj, APP.user.name||APP.user.username);
              pickerEl.innerHTML = `<div class="gift-msg" style="color:#7be0a0;">${T.giftSent}</div>`;
            };
          });
        };
      }
    }catch(e){ resultEl.innerHTML = `<div class="player-notfound">${T.notFound}</div>`; }
  }
  document.getElementById('playerSearchBtn').onclick = doSearch;
  document.getElementById('playerSearchInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });
  (async ()=>{
    let real = [];
    let loadError = null;
    try{
      const profiles = await fetchAllPublicProfiles();
      real = profiles.filter(p=> p.username && !/^(test|bot|prueba|demo)/i.test(p.username));
      real.sort((a,b)=>(b.points||0)-(a.points||0));
    }catch(e){ loadError = (e && e.message) || String(e); }
    const top = real.slice(0,20);
    const listEl = document.getElementById('leaderboardList');
    if(!listEl) return;

async function acceptChallengeInvite(inv){

async function checkChallengeProgress(){
  try{
    const myList = await loadChallenges(APP.user.username);
    let changed = false;
    for(const ch of myList){
      if(ch.status!=='active' || ch.winner) continue;
      const t = challengeTypeById(ch.typeId);
      const mySide = ch.userA===APP.user.username ? 'A':'B';
      let met = false;
      if(t.minOrder){ met = APP.objects.some(o=> o.ts>=ch.startTs && (RARITIES[o.rarityId]||RARITIES.comun).order>=t.minOrder); }
      else if(t.countTarget){ const startCount = mySide==='A'?ch.startCountA:ch.startCountB; met = APP.objects.length >= startCount + t.countTarget; }
      if(met){
        ch.status='done'; ch.winner=APP.user.username; changed=true;
        APP.user.points = (APP.user.points||0) + ch.reward;
        await saveAccount(APP.user);
        const otherUser = mySide==='A' ? ch.userB : ch.userA;
        const otherList = await loadChallenges(otherUser);
        const idx = otherList.findIndex(c=>c.id===ch.id);
        if(idx>=0){ otherList[idx] = ch; await saveChallengesList(otherUser, otherList); }
      }
    }
    if(changed) await saveChallengesList(APP.user.username, myList);
  }catch(e){}
}

    chArea.innerHTML = myChallenges.length ? myChallenges.slice().reverse().map(ch=>challengeRowHtml(ch, lang, T)).join('') : '';
    chArea.querySelectorAll('[data-dismiss-ch]').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.dataset.dismissCh;
        const list = await loadChallenges(APP.user.username);
        const filtered = list.filter(c=>c.id!==id);
        await saveChallengesList(APP.user.username, filtered);
        btn.closest('.player-card').remove();
      };
    });
  })();
}
function dmPairKey(a,b){ return [a,b].sort().join('__'); }
async function loadDm(pairKey){ const d = await firestoreGet('directMessages', pairKey); return (d&&d.list)||[]; }
async function sendDm(pairKey, from, text){
  const existing = await firestoreGet('directMessages', pairKey);
  const list = (existing&&existing.list)||[];
  list.push({from, text, ts:Date.now()});
  await firestoreSet('directMessages', pairKey, {list: list.slice(-100)});
}
function renderFriendChat(lang){
  const T = friendsT(lang);
  const otherUser = APP.friendChatWith;
  const pairKey = dmPairKey(APP.user.username, otherUser);
  app.innerHTML = `<div class="screen" id="screen-friendchat">
     <div class="chat-top"><span class="back" id="fchatBack">‹</span><h2 id="fchatTitle">${T.chat}</h2></div>
     <div class="chat-body" id="fchatBody"><div id="fchatMsgList"></div></div>
     <div class="chat-inputbar">
       <input class="field" id="fchatInput" placeholder="${T.typePh}">
       <button class="btn primary send-btn" id="fchatSend">➤</button>
     </div>
   </div>`;
  let stopped = false;
  document.getElementById('fchatBack').onclick = ()=>{ stopped = true; go('friends'); };
  firestoreGet('publicProfiles', otherUser).then(p=>{
    const el = document.getElementById('fchatTitle'); if(el && p) el.textContent = '💬 '+(p.name||otherUser);
  });
  async function tick(){
    if(stopped) return;
    const list = await loadDm(pairKey);
    const el = document.getElementById('fchatMsgList');
    if(!el) return;
    el.innerHTML = list.map(m=> `<div class="bubble ${m.from===APP.user.username?'user':'ai'}">${escapeHtml(m.text)}</div>`).join('');
    const body = document.getElementById('fchatBody');
    if(body) body.scrollTop = body.scrollHeight;
  }
  document.getElementById('fchatSend').onclick = async ()=>{
    const input = document.getElementById('fchatInput');
    const text = input.value.trim();
    if(!text) return;
    input.value='';
    await sendDm(pairKey, APP.user.username, text);
    tick();
  };
  document.getElementById('fchatInput').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('fchatSend').click(); });
  tick();
  APP.friendChatInterval = setInterval(tick, 3000);
}

/* ---------- GIFTS ---------- */
async function loadGifts(username){
  const d = await firestoreGet('gifts', username);
  return (d && d.list) || [];
}
async function clearGifts(username){ await firestoreDelete('gifts', username); }
async function sendGift(toUsername, amount, fromName){
  const newGift = {id:'g'+Date.now()+Math.random().toString(36).slice(2,6), from: fromName, points: amount, ts: Date.now()};
  const existing = await firestoreGet('gifts', toUsername);
  const list = (existing && existing.list) || [];
  list.push(newGift);
  await firestoreSet('gifts', toUsername, {list});
}
async function sendObjectGift(toUsername, obj, fromName){
  const newGift = {id:'g'+Date.now()+Math.random().toString(36).slice(2,6), from: fromName, object: obj, ts: Date.now()};
  const existing = await firestoreGet('gifts', toUsername);
  const list = (existing && existing.list) || [];
  list.push(newGift);
  await firestoreSet('gifts', toUsername, {list});
}
function showGiftPopup(gifts, lang){
  const totalPoints = gifts.reduce((s,g)=>s+(g.points||0),0);
  const objectGifts = gifts.filter(g=>g.object);
  const T = {
    title: lang==='en'?'You got a gift!':lang==='fr'?'Vous avez un cadeau !':lang==='it'?'Hai ricevuto un regalo!':lang==='de'?'Du hast ein Geschenk erhalten!':lang==='pt'?'Você recebeu um presente!':'¡Tienes un regalo!',
    claim: lang==='en'?'Claim':lang==='fr'?'Réclamer':lang==='it'?'Riscatta':lang==='de'?'Abholen':lang==='pt'?'Resgatar':'Reclamar'
  };
  const lines = gifts.map(g=> g.object
    ? (escapeHtml(g.from||'')+' → 🎁 '+escapeHtml(g.object.name||''))
    : (escapeHtml(g.from||'')+' → +'+(g.points||0)+' pts')
  ).join('<br>');
  vibrate(VIBE.gift);
  showLocalNotification(T.title, gifts.map(g=>g.from).filter(Boolean).join(', '), 'gift');
  const backdrop = document.createElement('div');
  backdrop.className = 'preview-backdrop';
  backdrop.innerHTML = `<div class="preview-modal glass">
      <dotlottie-player src="https://lottie.host/32580c17-f53b-4a75-b539-d42ea3d2b493/VU9qMP7Ygy.lottie" background="transparent" speed="1" style="width:120px;height:120px;margin:0 auto;" loop autoplay></dotlottie-player>
      <div class="obj-name">${T.title}</div>
      <div class="obj-curiosity">${lines}</div>
      ${totalPoints>0?`<div class="obj-points">+${totalPoints} pts</div>`:''}
      <button class="btn primary" id="claimGiftsBtn" style="margin-top:10px;">${T.claim}</button>
    </div>`;
  document.body.appendChild(backdrop);
  document.getElementById('claimGiftsBtn').onclick = async ()=>{
    APP.user.points = (APP.user.points||0) + totalPoints;
    if(objectGifts.length){
      objectGifts.forEach(g=>{ APP.objects.push({...g.object, id:'o'+Date.now()+Math.floor(Math.random()*1000)}); });
      await saveObjects(APP.user.username, APP.objects);
    }
    await saveAccount(APP.user);
    await clearGifts(APP.user.username);
    backdrop.remove();
    render();
  };
}

    equipped: lang==='en'?'Equipped':lang==='fr'?'Équipé':lang==='it'?'Equipaggiato':lang==='de'?'Ausgerüstet':lang==='pt'?'Equipado':'Equipado',
    equip: lang==='en'?'Equip':lang==='fr'?'Équiper':lang==='it'?'Equipaggia':lang==='de'?'Ausrüsten':lang==='pt'?'Equipar':'Equipar',
    locked: lang==='en'?'Locked':lang==='fr'?'Verrouillé':lang==='it'?'Bloccato':lang==='de'?'Gesperrt':lang==='pt'?'Bloqueado':'Bloqueado',

    showcase: lang==='en'?'Featured showcase':lang==='fr'?'Vitrine à la une':lang==='it'?'Vetrina in evidenza':lang==='de'?'Vitrine':lang==='pt'?'Vitrine em destaque':'Vitrina destacada',
    showcaseNote: lang==='en'?'Choose up to 3 objects other players will see first':lang==='fr'?'Choisissez jusqu\'à 3 objets que les autres verront en premier':lang==='it'?'Scegli fino a 3 oggetti che gli altri vedranno per primi':lang==='de'?'Wähle bis zu 3 Objekte, die andere zuerst sehen':lang==='pt'?'Escolha até 3 objetos que os outros verão primeiro':'Elige hasta 3 objetos que verán primero los demás',
    empty: lang==='en'?'Empty':lang==='fr'?'Vide':lang==='it'?'Vuoto':lang==='de'?'Leer':lang==='pt'?'Vazio':'Vacío',
    remove: lang==='en'?'Remove':lang==='fr'?'Retirer':lang==='it'?'Rimuovi':lang==='de'?'Entfernen':lang==='pt'?'Remover':'Quitar',
    privacy: lang==='en'?'Public collection (spy mode)':lang==='fr'?'Collection publique (mode espion)':lang==='it'?'Collezione pubblica (modalità spia)':lang==='de'?'Öffentliche Sammlung (Spionmodus)':lang==='pt'?'Coleção pública (modo espião)':'Colección pública (modo espía)',
    privacyNote: lang==='en'?'Lets other players browse your last 30 objects':lang==='fr'?'Permet aux autres de parcourir vos 30 derniers objets':lang==='it'?'Permette agli altri di sfogliare i tuoi ultimi 30 oggetti':lang==='de'?'Andere können deine letzten 30 Objekte durchsuchen':lang==='pt'?'Permite que outros vejam seus últimos 30 objetos':'Deja que otros vean tus últimos 30 objetos',
    on: lang==='en'?'Public ✅':lang==='fr'?'Publique ✅':lang==='it'?'Pubblica ✅':lang==='de'?'Öffentlich ✅':lang==='pt'?'Pública ✅':'Pública ✅',
    off: lang==='en'?'Private 🔒':lang==='fr'?'Privée 🔒':lang==='it'?'Privata 🔒':lang==='de'?'Privat 🔒':lang==='pt'?'Privada 🔒':'Privada 🔒'
  };
  const frame = frameById((APP.user.equipped||{}).frame||'none');
  const eqTitle = titleById(APP.user.equippedTitle);
  const featured = APP.user.featured||[];
  const slotsHtml = [0,1,2].map(i=>{
    const o = featured[i];
    if(o) return `<div class="showcase-slot filled" data-slot="${i}"><img src="${o.image||''}"><div class="showcase-slot-name">${escapeHtml(o.name)}</div></div>`;
    return `<div class="showcase-slot empty" data-slot="${i}"><div class="dex-q">+</div><div>${T.empty}</div></div>`;
  }).join('');
  app.innerHTML = `<div class="screen" id="screen-profile">
     <div class="top-bar"><span class="back" id="profBack">‹</span><h2>${T.title}</h2></div>
     <div class="profile-hero glass">
       ${frameWrapName(`<b>${escapeHtml(APP.user.name)}</b>`, frame.id)}
       ${eqTitle ? `<div class="player-title-tag">${eqTitle.name[lang]||eqTitle.name.es}</div>` : ''}
       <div class="points-badge" style="margin-top:8px;">✦ ${APP.user.points||0} pts</div>
       <div class="album-count" style="margin-top:4px;">${T.frameNote}</div>
     </div>
     <div class="wi-section-title">${T.showcase}</div>
     <div class="album-count" style="margin-bottom:8px;">${T.showcaseNote}</div>
     <div class="showcase-grid">${slotsHtml}</div>
     <div id="showcasePicker"></div>
     <div class="wi-section-title">${T.privacy}</div>
     <div class="album-count" style="margin-bottom:8px;">${T.privacyNote}</div>
     <button class="btn ${APP.user.collectionPublic?'primary':'ghost'} small" id="privacyToggle">${APP.user.collectionPublic?T.on:T.off}</button>
     <div class="wi-section-title" style="margin-top:18px;">${T.titles}</div>
     <div class="title-list" id="titleList"></div>
   </div>`;

  document.getElementById('privacyToggle').onclick = async ()=>{
    APP.user.collectionPublic = !APP.user.collectionPublic;
    await saveAccount(APP.user);
    if(APP.user.collectionPublic){ await saveObjects(APP.user.username, APP.objects); }
    else { await firestoreDelete('publicCollections', APP.user.username); }
    render();
  };
  document.querySelectorAll('.showcase-slot').forEach(slotEl=>{
    slotEl.onclick = ()=>{
      const idx = parseInt(slotEl.dataset.slot,10);
      const pickerEl = document.getElementById('showcasePicker');
      if(featured[idx]){
        featured.splice(idx,1);
        APP.user.featured = featured;
        saveAccount(APP.user).then(render);
        return;
      }
      if(pickerEl.dataset.open==='1'){ pickerEl.innerHTML=''; pickerEl.dataset.open='0'; return; }
      pickerEl.dataset.open='1';
      if(!APP.objects.length){ pickerEl.innerHTML = `<div class="album-count">${T.empty}</div>`; return; }
      pickerEl.innerHTML = `<div class="gift-obj-grid">${APP.objects.map(o=>objPhotoCardHtml(o,lang)).join('')}</div>`;
      pickerEl.querySelectorAll('[data-objid]').forEach(el=>{
        el.onclick = async ()=>{

    };
  });
}

/* ---------- SETTINGS ---------- */
function renderSettings(lang){
  const L=(k)=>tr(lang,k);
  const NT = {
    title: lang==='en'?'Notifications':'Notificaciones',
    desc: lang==='en'?'Get alerted for gifts, friend requests and challenges — even in another tab.':'Recibe avisos de regalos, solicitudes de amistad y desafíos, incluso en otra pestaña.',
    enable: lang==='en'?'🔔 Enable notifications':'🔔 Activar notificaciones',
    on: lang==='en'?'✅ Notifications on':'✅ Notificaciones activadas',
    off: lang==='en'?'🔕 Notifications off (blocked in browser)':'🔕 Notificaciones desactivadas (bloqueadas en el navegador)',
    unsupported: lang==='en'?'Your browser doesn\'t support notifications':'Tu navegador no soporta notificaciones',
    toggleOn: lang==='en'?'Pause notifications':'Pausar notificaciones',
    toggleOff: lang==='en'?'Resume notifications':'Reanudar notificaciones'
  };
  const chips = COUNTRIES.map(c=>`<div class="country-chip ${c.name===APP.user.countryName?'active':''}" data-iso="${c.iso}">${flagEmoji(c.iso)} ${c.name}</div>`).join('');
  const permission = notificationsSupported() ? Notification.permission : 'unsupported';
  let notifBlockHtml;
  if(permission==='unsupported'){
    notifBlockHtml = `<div class="settings-block glass"><label>${NT.title}</label><p style="font-size:12px; color:var(--text-dim); margin:4px 0 0;">${NT.unsupported}</p></div>`;
  } else if(permission==='granted'){
    const enabled = APP.user.notificationsEnabled!==false;
    notifBlockHtml = `<div class="settings-block glass">
      <label>${NT.title}</label>
      <p style="font-size:11.5px; color:var(--text-dim); margin:4px 0 8px;">${NT.desc}</p>
      <button class="btn ${enabled?'ghost':'primary'} small" id="notifToggleBtn" style="width:100%;">${enabled? '✅ '+ (lang==='en'?'On — tap to pause':'Activadas — toca para pausar') : '🔕 '+(lang==='en'?'Paused — tap to resume':'Pausadas — toca para reanudar')}</button>
    </div>`;
  } else if(permission==='denied'){
    notifBlockHtml = `<div class="settings-block glass"><label>${NT.title}</label><p style="font-size:12px; color:var(--text-dim); margin:4px 0 0;">${NT.off}</p></div>`;
  } else {
    notifBlockHtml = `<div class="settings-block glass">
      <label>${NT.title}</label>
      <p style="font-size:11.5px; color:var(--text-dim); margin:4px 0 8px;">${NT.desc}</p>
      <button class="btn primary small" id="notifEnableBtn" style="width:100%;">${NT.enable}</button>
    </div>`;
  }
  app.innerHTML = `<div class="screen" id="screen-settings">
     <div class="top-bar"><span class="back" id="setBack">‹</span><h2>${L('settingsTitle')}</h2></div>
     <div class="settings-block glass"><label>${L('nameLbl')}</label><input class="field" id="setName" value="${escapeHtml(APP.user.name)}"></div>
     <div class="settings-block glass"><label>${L('countryLbl')}</label><div class="country-select-list" id="setCountryList">${chips}</div></div>
     ${notifBlockHtml}
     <button class="btn primary" id="setSave">${L('saveBtn')}</button>
     <button class="btn ghost" id="setLogout">🚪 ${L('logoutBtn')}</button>
   </div>`;
  const notifEnableBtn = document.getElementById('notifEnableBtn');
  if(notifEnableBtn) notifEnableBtn.onclick = async ()=>{
    const res = await requestNotificationPermission();
    if(res==='granted'){ APP.user.notificationsEnabled = true; await saveAccount(APP.user); showLocalNotification('Rareza.AI', lang==='en'?'Notifications are on!':'¡Notificaciones activadas!', 'welcome'); }
    render();
  };
  const notifToggleBtn = document.getElementById('notifToggleBtn');
  if(notifToggleBtn) notifToggleBtn.onclick = async ()=>{
    APP.user.notificationsEnabled = APP.user.notificationsEnabled===false ? true : false;
    await saveAccount(APP.user);
    render();
  };
  let selectedIso = (COUNTRIES.find(c=>c.name===APP.user.countryName)||{}).iso || null;
  document.getElementById('setBack').onclick = ()=> go('menu');
  document.querySelectorAll('#setCountryList .country-chip').forEach(chip=>{
    chip.onclick = ()=>{ document.querySelectorAll('#setCountryList .country-chip').forEach(c=>c.classList.remove('active')); chip.classList.add('active'); selectedIso = chip.dataset.iso; };
  });
  document.getElementById('setSave').onclick = async ()=>{
    const name = document.getElementById('setName').value.trim();
    if(name) APP.user.name = name;
    if(selectedIso){ const country = countryByIso(selectedIso); APP.user.countryName = country.name; APP.user.lang = country.lang; }
    await saveAccount(APP.user);
    const toast = document.createElement('div'); toast.className='saved-toast'; toast.textContent = tr(APP.user.lang,'savedMsg');
    document.body.appendChild(toast); setTimeout(()=>toast.remove(), 1800);
    render();
  };
  document.getElementById('setLogout').onclick = async ()=>{
    await clearLastSession();
    APP.user=null; APP.objects=[]; APP.messages=[]; APP.authMode='login';
    go('auth');
  };
}

/* ============ BOOT ============ */
(async function boot(){
  try{
    const last = await getLastSession();
    if(last){
      const acc = await loadAccount(last);
      if(acc){ APP.user = normalizeUser(acc); APP.objects = await loadObjects(last); startPresencePing(); go(acc.onboarded ? 'menu' : 'onboarding'); return; }
    }
  }catch(e){}
  go('splash');
})();

})();
</script>
