<style>
  :root{
    --bg:#03050b; --bg2:#070c18;
    --panel: rgba(255,255,255,0.055); --panel-strong: rgba(255,255,255,0.09);
    --border: rgba(140,180,255,0.16);
    --blue:#3f8bff; --blue2:#1c4fd6; --blue-glow: rgba(63,139,255,0.55);
    --bubble1:#3f8bff; --bubble2:#1c4fd6;
    --text:#eef4ff; --text-dim:#90a4cc; --text-dim2:#5f719a; --danger:#ff5d7a;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--bg); overflow:hidden;}
  body{font-family:'Inter',sans-serif; color:var(--text); position:relative; width:100vw; height:100vh;}
  h1,h2,h3,.display{font-family:'Sora',sans-serif;}
  #stars{position:fixed; inset:0; z-index:0; pointer-events:none;}
  #app{position:relative; z-index:1; width:100%; height:100%; overflow:hidden;}
  .screen{position:absolute; inset:0; display:flex; flex-direction:column; animation:fadeIn .5s ease both;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  @keyframes popIn{from{opacity:0; transform:scale(.85);} to{opacity:1; transform:scale(1);}}
  @keyframes floaty{0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);}}
  @keyframes shimmerText{0%{background-position:0% 50%;} 100%{background-position:200% 50%;}}
  @keyframes dotBounce{0%,80%,100%{transform:translateY(0); opacity:.4;} 40%{transform:translateY(-6px); opacity:1;}}
  @keyframes scanLine{0%{top:0%;} 100%{top:100%;}}
  @keyframes rarityGlowSoft{0%,100%{box-shadow:0 0 10px var(--rc);} 50%{box-shadow:0 0 20px var(--rc);}}
  @keyframes rarityGlowMed{0%,100%{box-shadow:0 0 16px var(--rc);} 50%{box-shadow:0 0 32px var(--rc);}}
  @keyframes rarityShimmer{0%{background-position:-150% 0;} 100%{background-position:250% 0;}}
  @keyframes rarityAura{0%,100%{box-shadow:0 0 22px var(--rc),0 0 46px var(--rc);} 50%{box-shadow:0 0 40px var(--rc),0 0 74px var(--rc);}}
  @keyframes rarityCycle{0%{filter:hue-rotate(0deg);} 100%{filter:hue-rotate(360deg);}}
  @keyframes sparkPop{0%{transform:scale(0) translate(0,0); opacity:1;} 100%{transform:scale(1) translate(var(--sx),var(--sy)); opacity:0;}}
  @keyframes countUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(120,160,255,.35); border-radius:10px;}
  button{font-family:inherit;}
  .btn{border:1px solid var(--border); background:linear-gradient(180deg, rgba(63,139,255,.22), rgba(28,79,214,.14));
    color:var(--text); padding:14px 22px; border-radius:16px; font-weight:600; font-size:15px; cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;}
  .btn:hover{transform:scale(1.035); box-shadow:0 6px 24px rgba(63,139,255,.28);}
  .btn:active{transform:scale(.96);}
  .btn.primary{background:linear-gradient(135deg, var(--blue), var(--blue2)); border:none; box-shadow:0 4px 20px rgba(63,139,255,.35);}
  .btn.primary:hover{box-shadow:0 6px 30px rgba(63,139,255,.5);}
  .btn.ghost{background:transparent; border:1px solid var(--border);}
  .btn.small{padding:9px 14px; font-size:13px; border-radius:12px;}
  .btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}
  input.field{width:100%; padding:14px 16px; border-radius:14px; border:1px solid var(--border);
    background:rgba(255,255,255,.045); color:var(--text); font-size:15px; outline:none; transition:border .18s, box-shadow .18s;}
  input.field:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(63,139,255,.18);}
  input.field::placeholder{color:var(--text-dim2);}
  .glass{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);}

  /* SPLASH */
  #screen-splash{align-items:center; justify-content:center; text-align:center; gap:18px; cursor:pointer;}
  .logo-big{font-size:52px; font-weight:800; letter-spacing:-1px;
    background:linear-gradient(90deg, #7fb4ff, #3f8bff, #a7d2ff, #3f8bff); background-size:200% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shimmerText 4s linear infinite; filter:drop-shadow(0 0 26px rgba(63,139,255,.45));}
  .logo-sub{color:var(--text-dim); font-size:14px; letter-spacing:3px; text-transform:uppercase;}
  .tap-hint{margin-top:30px; font-size:13px; color:var(--text-dim2); animation:floaty 2.4s ease-in-out infinite;}

  /* AUTH / ONBOARDING */
  .center-wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:20px;}
  .auth-card{width:100%; max-width:360px; padding:30px 26px; display:flex; flex-direction:column; gap:14px; animation:popIn .4s ease both;}
  .auth-card h2{margin:0 0 2px; font-size:22px;}
  .auth-card p.sub{margin:0 0 10px; color:var(--text-dim); font-size:13.5px;}
  .switch-line{text-align:center; font-size:13px; color:var(--text-dim); margin-top:4px;}
  .switch-line span{color:var(--blue); cursor:pointer; font-weight:600;}
  .err-msg{color:var(--danger); font-size:13px; min-height:16px;}
  .country-select-list{display:flex; flex-wrap:wrap; gap:8px; max-height:170px; overflow-y:auto; padding:4px 2px;}
  .country-chip{padding:8px 12px; border-radius:12px; border:1px solid var(--border); background:rgba(255,255,255,.04);
    font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px; transition:.15s;}
  .country-chip:hover{background:rgba(63,139,255,.14); transform:translateY(-1px);}
  .country-chip.active{background:linear-gradient(135deg, var(--blue), var(--blue2)); border-color:transparent;}

  /* MENU */
  #screen-menu{padding:26px 20px; gap:18px;}
  .menu-top{display:flex; align-items:center; justify-content:space-between;}
  .menu-top .hello{font-size:13px; color:var(--text-dim);}
  .menu-top .uname{font-size:19px; font-weight:700;}
  .points-badge{background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:7px 14px;
    font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px;}
  .menu-grid{display:flex; flex-direction:column; gap:14px; margin-top:6px; overflow-y:auto;}
  .menu-item{padding:20px; display:flex; align-items:center; gap:16px; cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease; position:relative; overflow:hidden;}
  .menu-item:hover{transform:translateY(-2px); box-shadow:0 10px 30px rgba(63,139,255,.15);}
  .menu-item:active{transform:scale(.98);}
  .menu-item .ic{font-size:28px; width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, rgba(63,139,255,.28), rgba(28,79,214,.14)); flex-shrink:0;}
  .menu-item .txt h3{margin:0 0 3px; font-size:16px;}
  .menu-item .txt p{margin:0; font-size:12.5px; color:var(--text-dim);}
  .menu-item.locked{opacity:.55; cursor:default;}
  .menu-item.locked:hover{transform:none; box-shadow:none;}
  .soon-tag{position:absolute; top:12px; right:14px; font-size:10px; letter-spacing:1px; text-transform:uppercase;
    background:rgba(255,255,255,.08); padding:4px 8px; border-radius:8px; color:var(--text-dim);}
  .menu-footer{margin-top:auto; display:flex; justify-content:center; padding-top:10px;}
  .wordmark{font-family:'Sora',sans-serif; font-weight:800; font-size:22px; letter-spacing:-.5px;
    background:linear-gradient(90deg, #7fb4ff, #3f8bff, #a7d2ff, #3f8bff); background-size:200% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent; animation:shimmerText 4s linear infinite;
    filter:drop-shadow(0 0 14px rgba(63,139,255,.35));}
  .menu-sub{display:flex; align-items:center; justify-content:space-between; margin-top:-8px;}
  .menu-sub .hello{font-size:13px; color:var(--text-dim);}
  .menu-sub .hello b{color:var(--text); font-weight:700;}
  .menu-clock{font-size:12.5px; color:var(--text-dim); font-variant-numeric:tabular-nums; letter-spacing:.5px;
    background:rgba(255,255,255,.05); border:1px solid var(--border); padding:4px 10px; border-radius:10px;}

  /* COLLECTIONS HUB / WORLD INDEX */
  #screen-collections{padding:22px 20px; gap:14px;}
  #screen-scancat{padding:22px 20px; gap:14px;}
  #screen-players{padding:20px; gap:6px;}
  .player-search{display:flex; gap:8px; margin:10px 0 14px;}
  .player-search input{flex:1;}
  .player-card{padding:16px; display:flex; flex-direction:column; gap:4px; margin-bottom:6px;}
  .player-name{font-weight:700; font-size:16px;}
  .player-points{color:#7be0a0; font-weight:700; font-size:13px;}
  .player-meta{font-size:12px; color:var(--text-dim);}
  .player-notfound{font-size:13px; color:var(--text-dim); text-align:center; padding:14px 0;}
  .leaderboard-list{display:flex; flex-direction:column; gap:8px; overflow-y:auto; flex:1; margin-top:8px;}
  .leaderboard-row{display:flex; align-items:center; gap:10px; padding:10px 14px; position:relative; overflow:hidden;
    background-image:
      radial-gradient(circle at 8% 50%, #c81f34 0 9px, #a3182a 9px 13px, transparent 14px),
      radial-gradient(circle at 8% 50%, #e8455a 0 5px, transparent 6px),
      radial-gradient(ellipse 7px 4px at 4% 30%, #2f8f4e 0 100%, transparent 100%),
      radial-gradient(ellipse 7px 4px at 12% 70%, #2f8f4e 0 100%, transparent 100%),
      radial-gradient(circle at 46% 50%, #c81f34 0 9px, #a3182a 9px 13px, transparent 14px),
      radial-gradient(circle at 46% 50%, #e8455a 0 5px, transparent 6px),
      radial-gradient(ellipse 7px 4px at 42% 30%, #2f8f4e 0 100%, transparent 100%),
      radial-gradient(ellipse 7px 4px at 50% 70%, #2f8f4e 0 100%, transparent 100%),
      radial-gradient(circle at 84% 50%, #c81f34 0 9px, #a3182a 9px 13px, transparent 14px),
      radial-gradient(circle at 84% 50%, #e8455a 0 5px, transparent 6px),
      radial-gradient(ellipse 7px 4px at 80% 30%, #2f8f4e 0 100%, transparent 100%),
      radial-gradient(ellipse 7px 4px at 88% 70%, #2f8f4e 0 100%, transparent 100%),
      linear-gradient(180deg, #2b0b10, #1a0709);
    background-size:110px 100%; background-repeat:repeat-x;}
  .leaderboard-row::before{content:''; position:absolute; inset:0; background:linear-gradient(90deg, rgba(3,5,11,.35), rgba(3,5,11,.55)); z-index:0;}
  .leaderboard-row > *{position:relative; z-index:1;}
  .lb-rank{font-weight:800; width:30px; text-align:center; flex-shrink:0;}
  .lb-name{flex:1; font-size:13.5px; font-weight:600;}
  .lb-points{font-size:12.5px; color:#7be0a0; font-weight:700;}
  .loading-mini{text-align:center; padding:10px; color:var(--text-dim); font-size:12px;}
  .name-framed{display:inline-flex; align-items:center; padding:3px 12px; border-radius:14px; border:2px solid transparent;}
  .player-title-tag{font-size:10.5px; color:var(--blue); background:rgba(63,139,255,.14); padding:2px 9px; border-radius:9px; display:inline-block; margin-top:3px;}
  .gift-form{display:flex; gap:8px; margin-top:10px;}
  .gift-form input{flex:1;}
  .gift-msg{font-size:12px; margin-top:6px; text-align:center; color:var(--text-dim);}
  .gift-obj-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-top:8px; max-height:220px; overflow-y:auto;}
  .showcase-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:10px;}
  .showcase-grid.mini{margin:10px 0 0;}
  .showcase-slot{aspect-ratio:1/1; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    background:rgba(255,255,255,.03); border:2px dashed rgba(255,255,255,.15); color:var(--text-dim2); font-size:10px; text-align:center; cursor:pointer; position:relative; overflow:hidden;}
  .showcase-slot.filled{border-style:solid; border-color:rgba(255,201,74,.4);}
  .showcase-slot.filled img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .showcase-slot-name{position:absolute; left:0; right:0; bottom:0; font-size:10px; padding:4px 6px; text-align:center;
    background:linear-gradient(to top, rgba(0,0,0,.75), transparent); color:#fff; font-weight:600;}
  #screen-profile{padding:20px; gap:14px;}
  .profile-hero{padding:24px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center;}
  .title-list{display:flex; flex-direction:column; gap:10px; margin-top:6px; overflow-y:auto; flex:1;}
  .title-row{display:flex; align-items:center; justify-content:space-between; padding:12px 16px;}
  .title-row.locked{opacity:.4;}
  .gift-inbox-note{font-size:11px; color:#7be0a0; text-align:center;}
  .hub-grid{display:flex; flex-direction:column; gap:14px; margin-top:6px;}
  .hub-item{padding:18px; display:flex; align-items:center; gap:16px; cursor:pointer; transition:transform .18s, box-shadow .18s;}
  .hub-item:hover{transform:translateY(-2px); box-shadow:0 10px 30px rgba(63,139,255,.15);}
  .hub-item .ic{font-size:26px; width:50px; height:50px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, rgba(63,139,255,.28), rgba(28,79,214,.14)); flex-shrink:0;}
  .hub-item .txt h3{margin:0 0 3px; font-size:15.5px;} .hub-item .txt p{margin:0; font-size:12px; color:var(--text-dim);}

  #screen-worldindex{padding:20px; gap:12px;}
  .wi-progress{font-size:12px; color:var(--text-dim);}
  .wi-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; overflow-y:auto; flex:1; align-content:start;}
  .wi-section-title{font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin:14px 0 8px;}

  .obj-photo-card{aspect-ratio:1/1; border-radius:16px; overflow:hidden; position:relative; cursor:pointer;
    border:2px solid rgba(255,255,255,.08); transition:transform .15s ease;}
  .obj-photo-card:hover{transform:scale(1.03);}
  .obj-photo-card img{width:100%; height:100%; object-fit:cover; display:block;}
  .obj-emoji-big{width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:34px; background:rgba(255,255,255,.04);}
  .obj-photo-name{position:absolute; left:0; right:0; bottom:0; font-size:10px; padding:4px 6px; text-align:center;
    background:linear-gradient(to top, rgba(0,0,0,.75), transparent); color:#fff; font-weight:600;}
  .dex-card{aspect-ratio:1/1; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    background:rgba(255,255,255,.03); border:2px dashed rgba(255,255,255,.12); color:var(--text-dim2); font-size:10px; text-align:center; padding:6px;}
  .dex-card .dex-q{font-size:24px; opacity:.5;}

  .preview-backdrop{position:fixed; inset:0; background:rgba(3,5,11,.78); backdrop-filter:blur(6px); z-index:80;
    display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn .25s ease both;}
  .preview-modal{width:100%; max-width:340px; padding:28px 22px; display:flex; flex-direction:column; align-items:center; gap:8px;
    position:relative; text-align:center;}
  .preview-close{position:absolute; top:10px; right:14px; font-size:22px; color:var(--text-dim); cursor:pointer; line-height:1;}
  .preview-modal .obj-photo{width:120px; height:120px; border-radius:22px; margin-bottom:4px;}
  .preview-modal .obj-emoji{font-size:60px;}
  .preview-modal .obj-name{font-size:19px;}
  .preview-dex-tag{font-size:11px; color:var(--blue); background:rgba(63,139,255,.14); padding:3px 10px; border-radius:10px; margin-top:2px;}

  /* GLOBE / ALBUM */
  #screen-globe{align-items:center; justify-content:flex-start; padding:26px 20px; gap:10px; text-align:center;}
  #screen-globe h2{margin:4px 0 2px; font-size:20px;}
  #screen-globe .hint{color:var(--text-dim); font-size:13px; margin-bottom:6px;}
  #globeCanvas{touch-action:none; cursor:grab;}
  #globeCanvas:active{cursor:grabbing;}
  .country-reveal{min-height:74px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;}
  .country-reveal .cname{font-size:26px; font-weight:800; animation:popIn .35s ease both;}
  .country-reveal .clabel{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text-dim2);}
  .globe-actions{display:flex; gap:10px; margin-top:8px;}

  #screen-album{padding:20px; gap:12px;}
  .album-header{display:flex; align-items:center; gap:12px;}
  .album-header .back{font-size:20px; cursor:pointer; color:var(--text-dim);}
  .album-header .info{flex:1;}
  .album-header .cname2{font-weight:700; font-size:17px;}
  .album-count{font-size:12px; color:var(--text-dim);}
  .album-grid{flex:1; overflow-y:auto; display:grid; grid-template-columns:1fr 1fr; gap:12px; padding-bottom:14px;}
  .album-empty{grid-column:1/-1; text-align:center; color:var(--text-dim); font-size:13.5px; padding:40px 10px;}

  /* OBJECT CARD (album + reveal) */
  .obj-card{padding:14px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; position:relative; --rc:#9aa5c0;}
  .obj-emoji{font-size:34px; margin-bottom:2px;}
  .obj-photo{width:56px; height:56px; border-radius:14px; object-fit:cover; margin-bottom:2px; border:1px solid rgba(255,255,255,.15);}
  .obj-country{font-size:10.5px; color:var(--text-dim); display:flex; align-items:center; gap:4px; margin-top:1px;}
  .obj-name{font-weight:700; font-size:14px;}
  .obj-cat{font-size:11px; color:var(--text-dim);}
  .rarity-badge{font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; padding:3px 10px;
    border-radius:20px; border:1px solid; margin-top:2px;}
  .obj-curiosity{font-size:11.5px; color:var(--text-dim); line-height:1.35; margin-top:2px;}
  .obj-points{font-size:11px; color:#7be0a0; font-weight:700; margin-top:2px;}
  .rarity-comun{border-color:rgba(255,255,255,.1);}
  .rarity-poco_comun{border-color:transparent; animation:rarityGlowSoft 2.6s ease-in-out infinite;}
  .rarity-raro{border-color:transparent; animation:rarityGlowMed 2.2s ease-in-out infinite;}
  .rarity-epico{border-color:transparent; animation:rarityGlowMed 1.9s ease-in-out infinite; position:relative; overflow:hidden;}
  .rarity-epico::before{content:''; position:absolute; inset:0; background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.18) 50%, transparent 70%);
    background-size:250% 100%; animation:rarityShimmer 2.4s linear infinite; pointer-events:none;}
  .rarity-legendario{border-color:transparent; animation:rarityAura 2s ease-in-out infinite; position:relative; overflow:hidden;}
  .rarity-legendario::before{content:''; position:absolute; inset:0; background:linear-gradient(100deg, transparent 25%, rgba(255,255,255,.22) 50%, transparent 75%);
    background-size:250% 100%; animation:rarityShimmer 1.8s linear infinite; pointer-events:none;}
  .rarity-mitico{border-color:transparent; animation:rarityAura 1.6s ease-in-out infinite; position:relative; overflow:hidden;}
  .rarity-mitico .obj-emoji{animation:rarityCycle 3s linear infinite;}
  .rarity-mitico::before{content:''; position:absolute; inset:0; background:linear-gradient(100deg, transparent 20%, rgba(255,255,255,.28) 50%, transparent 80%);
    background-size:250% 100%; animation:rarityShimmer 1.3s linear infinite; pointer-events:none;}
  @keyframes prohibidoFlicker{0%,19%,21%,23%,25%,54%,56%,100%{opacity:1;} 20%,24%,55%{opacity:.5;}}
  .rarity-prohibido{border-color:transparent; animation:rarityAura 1.15s ease-in-out infinite, prohibidoFlicker 3s infinite; position:relative; overflow:hidden;}
  .rarity-prohibido::before{content:''; position:absolute; inset:0; background:linear-gradient(100deg, transparent 15%, rgba(255,30,60,.4) 50%, transparent 85%);
    background-size:250% 100%; animation:rarityShimmer 1s linear infinite; pointer-events:none;}
  @keyframes vipGlow{
    0%{box-shadow:0 0 24px #ff5fd1, 0 0 48px #ff5fd1;} 20%{box-shadow:0 0 24px #ffd700, 0 0 48px #ffd700;}
    40%{box-shadow:0 0 24px #57d68d, 0 0 48px #57d68d;} 60%{box-shadow:0 0 24px #4fa3ff, 0 0 48px #4fa3ff;}
    80%{box-shadow:0 0 24px #a463ff, 0 0 48px #a463ff;} 100%{box-shadow:0 0 24px #ff5fd1, 0 0 48px #ff5fd1;}}
  .rarity-vip{border-color:transparent; animation:vipGlow 2.2s linear infinite; position:relative; overflow:hidden;}
  .rarity-vip .obj-emoji{animation:rarityCycle 2s linear infinite;}
  .rarity-vip::before{content:''; position:absolute; inset:0; background:linear-gradient(100deg, transparent 10%, rgba(255,255,255,.45) 50%, transparent 90%);
    background-size:250% 100%; animation:rarityShimmer 0.8s linear infinite; pointer-events:none;}

  /* SCAN */
  #screen-scan{padding:24px 20px; gap:16px; align-items:center; text-align:center;}
  .scan-top{display:flex; align-items:center; gap:12px; width:100%;}
  .scan-top .back{font-size:20px; cursor:pointer; color:var(--text-dim);}
  .scan-capture{width:100%; max-width:320px; aspect-ratio:1/1; border-radius:24px; border:2px dashed var(--border);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; cursor:pointer;
    background:rgba(255,255,255,.03); transition:.2s;}
  .scan-capture:hover{border-color:var(--blue); background:rgba(63,139,255,.06);}
  .scan-capture .ic{font-size:52px;}
  .scan-preview-wrap{width:100%; max-width:320px; aspect-ratio:1/1; border-radius:24px; overflow:hidden; position:relative; background:#000;}
  .scan-preview-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .scan-overlay{position:absolute; inset:0; background:rgba(3,5,11,.45); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;}
  .scan-line{position:absolute; left:0; right:0; height:3px; background:linear-gradient(90deg, transparent, #7fc4ff, transparent);
    box-shadow:0 0 16px 4px rgba(127,196,255,.7); animation:scanLine 1.6s ease-in-out infinite alternate;}
  .scan-fx{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
  @keyframes leafFall{0%{transform:translateY(-30px) rotate(0deg); opacity:0;} 12%{opacity:1;} 100%{transform:translateY(320px) rotate(360deg); opacity:.15;}}
  .scan-fx-leaves span{position:absolute; top:-24px; font-size:22px; animation:leafFall 2.2s linear infinite;}
  .scan-fx-leaves span:nth-child(1){left:12%; animation-delay:0s;}
  .scan-fx-leaves span:nth-child(2){left:38%; animation-delay:.5s;}
  .scan-fx-leaves span:nth-child(3){left:63%; animation-delay:1s;}
  .scan-fx-leaves span:nth-child(4){left:85%; animation-delay:1.5s;}
  @keyframes scanRingPulse{0%{width:20px; height:20px; opacity:1;} 100%{width:280px; height:280px; opacity:0;}}
  .scan-fx-orb{display:flex; align-items:center; justify-content:center;}
  .scan-ring{position:absolute; border:2px solid rgba(63,139,255,.85); border-radius:50%; animation:scanRingPulse 1.8s ease-out infinite;}
  .scan-ring.r2{animation-delay:.6s;} .scan-ring.r3{animation-delay:1.2s;}
  .scan-fx-sparkles span{position:absolute; width:4px; height:4px; border-radius:50%; background:#ffc94a; box-shadow:0 0 8px #ffc94a;
    top:calc(8% + (var(--i)*10%)); left:calc(8% + (var(--i)*11%)); animation:sparkleTwinkle 1.2s ease-in-out infinite; animation-delay:calc(var(--i)*0.12s);}
  .scan-radar-sweep{position:absolute; inset:0; background:conic-gradient(from 0deg, rgba(63,139,255,.55), transparent 25%); animation:radarSpin 1.6s linear infinite;}
  .scan-web-spin{position:absolute; inset:0;
    background:conic-gradient(from 0deg, rgba(230,36,41,.4) 0deg 90deg, rgba(27,63,160,.4) 90deg 180deg, rgba(230,36,41,.4) 180deg 270deg, rgba(27,63,160,.4) 270deg 360deg);
    animation:radarSpin 1.8s linear infinite;}
  .reveal-wrap{display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; max-width:340px;}
  .reveal-card{width:100%; padding:26px 20px; display:flex; flex-direction:column; align-items:center; gap:8px; --rc:#9aa5c0; position:relative; overflow:hidden;}
  .reveal-card .obj-emoji{font-size:56px;}
  .reveal-card .obj-photo{width:110px; height:110px; border-radius:20px;}
  .reveal-card .obj-name{font-size:20px;}
  .spark{position:absolute; top:50%; left:50%; width:5px; height:5px; border-radius:50%; background:var(--rc); pointer-events:none;
    animation:sparkPop 900ms ease-out forwards;}
  .scan-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}

  /* CHAT */
  #screen-chat{padding:0;}
  .chat-header{display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--border);
    background:rgba(6,10,20,.55); backdrop-filter:blur(14px);}
  .chat-header .back{cursor:pointer; font-size:20px; color:var(--text-dim);}
  .chat-header .info{flex:1;}
  .chat-header .info .title{font-weight:700; font-size:15px;}
  .chat-body{flex:1; overflow-y:auto; padding:18px 16px; display:flex; flex-direction:column; gap:12px; position:relative;}
  .chat-body > *{position:relative; z-index:1;}
  .app-bg-media{position:absolute; inset:0; z-index:0; pointer-events:none; background-position:center; background-repeat:no-repeat; background-size:cover;}
  .app-bg-media::after{content:''; position:absolute; inset:0; background:rgba(3,5,11,.35);}
  .app-bg-media ~ *{position:relative; z-index:1;}
  .shop-bg-preview{width:44px; height:32px; border-radius:8px; border:1px solid rgba(255,255,255,.15); position:relative; overflow:hidden; background-position:center; background-size:cover;}
  .bubble{max-width:82%; padding:12px 15px; border-radius:18px; font-size:14.5px; line-height:1.45; animation:popIn .3s ease both;}
  .bubble.user{align-self:flex-end; background:linear-gradient(135deg, var(--bubble1), var(--bubble2)); border-bottom-right-radius:5px;}
  .bubble.ai{align-self:flex-start; background:var(--panel); border:1px solid var(--border); border-bottom-left-radius:5px;}
  .bubble.err{align-self:flex-start; background:rgba(255,93,122,.12); border:1px solid rgba(255,93,122,.35); color:#ffb2c0;}
  .typing-dots{display:flex; gap:5px; align-self:flex-start; padding:14px 16px;}
  .typing-dots span{width:7px; height:7px; border-radius:50%; background:var(--blue); animation:dotBounce 1.1s infinite;}
  .typing-dots span:nth-child(2){animation-delay:.15s;} .typing-dots span:nth-child(3){animation-delay:.3s;}
  .typing-wrap{align-self:flex-start; padding:14px 16px;}
  @keyframes limitSwing{0%,100%{transform:rotate(-8deg);} 50%{transform:rotate(8deg);}}
  .limit-card{align-self:center; padding:20px 24px; display:flex; flex-direction:column; align-items:center; gap:6px;
    text-align:center; border:1px solid rgba(255,178,63,.35); background:linear-gradient(135deg, rgba(255,178,63,.12), rgba(63,139,255,.1));
    max-width:85%;}
  .limit-ic{font-size:32px; animation:limitSwing 1.8s ease-in-out infinite;}
  .limit-title{font-weight:800; font-size:14.5px;}
  .limit-sub{font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-top:2px;}
  .limit-countdown{font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:2px;
    background:linear-gradient(90deg,#ffb23f,#ff5470); -webkit-background-clip:text; background-clip:text; color:transparent;}

  /* LOADING EFFECTS */
  @keyframes leafFloat{0%,100%{transform:translateY(0) rotate(-8deg);} 50%{transform:translateY(-8px) rotate(8deg);}}
  @keyframes ringPulse{0%{transform:scale(.4); opacity:.8;} 100%{transform:scale(1.4); opacity:0;}}
  @keyframes sparkleTwinkle{0%,100%{opacity:.2; transform:scale(.6);} 50%{opacity:1; transform:scale(1.3);}}
  @keyframes radarSpin{to{transform:rotate(360deg);}}
  .load-leaves{display:flex; gap:6px;}
  .load-leaves span{font-size:16px; display:inline-block; animation:leafFloat 1.4s ease-in-out infinite;}
  .load-leaves span:nth-child(2){animation-delay:.2s;} .load-leaves span:nth-child(3){animation-delay:.4s;}
  .load-orb{position:relative; width:26px; height:26px;}
  .orb-core{position:absolute; inset:6px; border-radius:50%; background:radial-gradient(circle, #fff, var(--blue)); box-shadow:0 0 10px var(--blue);}
  .orb-ring{position:absolute; inset:0; border:2px solid var(--blue); border-radius:50%; opacity:.6; animation:ringPulse 1.4s ease-out infinite;}
  .orb-ring.r2{animation-delay:.7s;}
  .load-sparkles{display:flex; gap:4px; align-items:center;}
  .load-sparkles span{width:5px; height:5px; border-radius:50%; background:#ffc94a; box-shadow:0 0 6px #ffc94a; display:inline-block; animation:sparkleTwinkle 1s ease-in-out infinite;}
  .load-sparkles span:nth-child(2){animation-delay:.15s;} .load-sparkles span:nth-child(3){animation-delay:.3s;}
  .load-sparkles span:nth-child(4){animation-delay:.45s;} .load-sparkles span:nth-child(5){animation-delay:.6s;}
  .load-radar{position:relative; width:26px; height:26px; border-radius:50%; border:2px solid rgba(63,139,255,.3); overflow:hidden;}
  .radar-sweep{position:absolute; inset:0; background:conic-gradient(from 0deg, rgba(63,139,255,.9), transparent 30%); animation:radarSpin 1s linear infinite;}
  .load-web{position:relative; width:26px; height:26px; border-radius:50%;
    background:conic-gradient(from 0deg, #e62429 0deg 90deg, #1b3fa0 90deg 180deg, #e62429 180deg 270deg, #1b3fa0 270deg 360deg);
    animation:radarSpin 1.4s linear infinite; box-shadow:0 0 10px rgba(230,36,41,.45), 0 0 10px rgba(27,63,160,.35);}
  .load-web::before{content:''; position:absolute; inset:3px; border-radius:50%;
    background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.4) 0 2deg, transparent 2deg 30deg); mix-blend-mode:overlay;}
  .load-car{position:relative; width:38px; height:22px; overflow:hidden;}
  .load-car .car-emoji{position:absolute; left:6px; top:2px; font-size:16px; animation:carBounce .4s ease-in-out infinite alternate; z-index:2;}
  .load-car .line{position:absolute; right:0; height:2px; background:rgba(63,139,255,.65); border-radius:2px; animation:carLine .6s linear infinite;}
  .load-car .line.l1{top:5px; width:14px; animation-delay:0s;}
  .load-car .line.l2{top:11px; width:10px; animation-delay:.15s;}
  .load-car .line.l3{top:17px; width:16px; animation-delay:.3s;}
  @keyframes carBounce{0%{transform:translateY(0);} 100%{transform:translateY(-2px);}}
  @keyframes carLine{0%{transform:translateX(0); opacity:1;} 100%{transform:translateX(-40px); opacity:0;}}
  .scan-fx-car{display:flex; align-items:flex-end; justify-content:center;}
  .car-road{position:absolute; left:0; right:0; bottom:20%; height:3px;
    background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.75) 0 14px, transparent 14px 28px);
    animation:roadScroll .5s linear infinite;}
  @keyframes roadScroll{0%{background-position-x:0;} 100%{background-position-x:-28px;}}
  .car-emoji-big{position:absolute; bottom:21%; font-size:42px; animation:carBounce .32s ease-in-out infinite alternate;
    filter:drop-shadow(0 6px 6px rgba(0,0,0,.4));}
  .car-dust{position:absolute; bottom:20%; left:calc(50% - 32px); width:22px; height:6px; border-radius:50%;
    background:rgba(255,255,255,.3); filter:blur(2px); animation:dustPuff .5s ease-out infinite;}
  @keyframes dustPuff{0%{transform:scale(.4); opacity:.6;} 100%{transform:scale(1.7) translateX(-16px); opacity:0;}}
  .load-portal{position:relative; width:26px; height:26px; border-radius:50%; overflow:hidden;
    background:conic-gradient(from 0deg, #6c5ce7, #341f97, #a463ff, #341f97, #6c5ce7); animation:radarSpin 1.2s linear infinite;
    box-shadow:0 0 10px rgba(108,92,231,.6);}
  .load-portal::before{content:''; position:absolute; inset:6px; border-radius:50%; background:radial-gradient(circle, #0a0a1a 45%, transparent 75%);}
  .scan-fx-portal{display:flex; align-items:center; justify-content:center;}
  .scan-portal-ring{position:absolute; width:56%; height:56%; border-radius:50%;
    background:conic-gradient(from 0deg, #6c5ce7, #341f97, #a463ff, #341f97, #6c5ce7); animation:radarSpin 1.4s linear infinite;
    box-shadow:0 0 30px rgba(108,92,231,.6);}
  .scan-portal-ring::before{content:''; position:absolute; inset:16%; border-radius:50%; background:radial-gradient(circle, #05050f 50%, transparent 78%);}
  .load-fire{display:flex; align-items:center; justify-content:center;}
  .load-fire span{font-size:20px; display:inline-block; animation:fireFlicker .5s ease-in-out infinite alternate;}
  @keyframes fireFlicker{0%{transform:scale(1) rotate(-4deg); filter:brightness(1);} 100%{transform:scale(1.18) rotate(4deg); filter:brightness(1.35);}}
  .scan-fx-fire{display:flex; align-items:center; justify-content:center;}
  .scan-fire-emoji{font-size:48px; animation:fireFlicker .4s ease-in-out infinite alternate; filter:drop-shadow(0 0 20px rgba(255,120,20,.6));}
  .scan-fx-fire .ember{position:absolute; bottom:35%; width:4px; height:4px; border-radius:50%; background:#ffb347; animation:emberRise 1.4s ease-out infinite;}
  @keyframes emberRise{0%{transform:translateY(0) scale(1); opacity:1;} 100%{transform:translateY(-110px) scale(.3); opacity:0;}}
  @keyframes rayoFlash{0%,100%{opacity:1; filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 10px #6cf);} 8%{opacity:.25;} 16%{opacity:1;} 40%{opacity:1;} 48%{opacity:.15;} 56%{opacity:1;}}
  .load-rayo{display:flex; align-items:center; justify-content:center;}
  .load-rayo span{font-size:20px; display:inline-block; animation:rayoFlash 1.1s steps(1) infinite;}
  .scan-fx-rayo{display:flex; align-items:center; justify-content:center;}
  .scan-rayo-emoji{font-size:54px; animation:rayoFlash 1.1s steps(1) infinite;}
  @keyframes rayoBgFlash{0%,100%{opacity:0;} 6%{opacity:1;} 12%{opacity:0;} 50%{opacity:0;} 55%{opacity:.55;} 60%{opacity:0;}}
  .scan-fx-rayo .flash{position:absolute; inset:0; background:rgba(150,210,255,.18); animation:rayoBgFlash 1.4s steps(1) infinite;}
  @keyframes diamondShine{0%,100%{transform:scale(1) rotate(0deg); filter:brightness(1);} 50%{transform:scale(1.15) rotate(8deg); filter:brightness(1.5) drop-shadow(0 0 8px #dfffff);}}
  .load-diamante{display:flex; align-items:center; justify-content:center;}
  .load-diamante span{font-size:18px; display:inline-block; animation:diamondShine 1.3s ease-in-out infinite;}
  .scan-fx-diamante{display:flex; align-items:center; justify-content:center;}
  .scan-diamante-emoji{font-size:52px; animation:diamondShine 1.3s ease-in-out infinite; filter:drop-shadow(0 0 16px rgba(223,255,255,.7));}
  .scan-fx-diamante span{position:absolute; width:4px; height:4px; border-radius:50%; background:#dfffff; box-shadow:0 0 6px #dfffff;
    top:calc(10% + (var(--i)*16%)); left:calc(15% + (var(--i)*14%)); animation:sparkleTwinkle 1.1s ease-in-out infinite; animation-delay:calc(var(--i)*0.15s);}
  .load-luna{display:flex; align-items:center; justify-content:center;}
  .load-luna span{font-size:18px; display:inline-block; animation:lunaGlow 2s ease-in-out infinite;}
  @keyframes lunaGlow{0%,100%{filter:drop-shadow(0 0 3px #cdefff);} 50%{filter:drop-shadow(0 0 10px #cdefff) drop-shadow(0 0 18px #8fd9ff);}}
  .scan-fx-luna{display:flex; align-items:center; justify-content:center;}
  .scan-luna-emoji{font-size:50px; animation:lunaGlow 2.4s ease-in-out infinite;}
  .scan-fx-luna .star{position:absolute; width:3px; height:3px; border-radius:50%; background:#fff; box-shadow:0 0 5px #fff; animation:sparkleTwinkle 1.4s ease-in-out infinite;}
  .load-bigbang{position:relative; width:26px; height:26px;}

function loadingById(id){ return LOADING_EFFECTS.find(l=>l.id===id) || LOADING_EFFECTS[0]; }
function loadingIndicatorHtml(id){
  if(id==='leaves') return `<div class="load-leaves"><span>🍃</span><span>🍃</span><span>🍃</span></div>`;
  if(id==='orb') return `<div class="load-orb"><div class="orb-ring"></div><div class="orb-ring r2"></div><div class="orb-core"></div></div>`;
  if(id==='sparkles') return `<div class="load-sparkles"><span></span><span></span><span></span><span></span><span></span></div>`;
  if(id==='radar') return `<div class="load-radar"><div class="radar-sweep"></div></div>`;
  if(id==='webslinger') return `<div class="load-web"></div>`;
  if(id==='cardrive') return `<div class="load-car"><span class="car-emoji">🏎️</span><span class="line l1"></span><span class="line l2"></span><span class="line l3"></span></div>`;
  if(id==='portal') return `<div class="load-portal"></div>`;
  if(id==='fuego') return `<div class="load-fire"><span>🔥</span></div>`;
  if(id==='rayo') return `<div class="load-rayo"><span>⚡</span></div>`;
  if(id==='diamante') return `<div class="load-diamante"><span>💎</span></div>`;
  if(id==='luna') return `<div class="load-luna"><span>🌙</span></div>`;
  if(id==='bigbang') return `<div class="load-bigbang" style="--rc:#ffb23f"><div class="core"></div>${Array.from({length:6}).map((_,i)=>{const a=(i/6)*Math.PI*2; const d=13; return `<span class="spark" style="--sx:${(Math.cos(a)*d).toFixed(1)}px; --sy:${(Math.sin(a)*d).toFixed(1)}px; animation-duration:.9s; animation-delay:${(i*0.05).toFixed(2)}s;"></span>`;}).join('')}</div>`;
  return `<div class="typing-dots" style="padding:0;"><span></span><span></span><span></span></div>`;
}
function scanOverlayEffectHtml(id){
  if(id==='leaves') return `<div class="scan-fx scan-fx-leaves"><span>🍃</span><span>🍃</span><span>🍃</span><span>🍃</span></div>`;
  if(id==='orb') return `<div class="scan-fx scan-fx-orb"><div class="scan-ring"></div><div class="scan-ring r2"></div><div class="scan-ring r3"></div></div>`;
  if(id==='sparkles') return `<div class="scan-fx scan-fx-sparkles">${Array.from({length:8}).map((_,i)=>`<span style="--i:${i}"></span>`).join('')}</div>`;
  if(id==='radar') return `<div class="scan-fx"><div class="scan-radar-sweep"></div></div>`;
  if(id==='webslinger') return `<div class="scan-fx"><div class="scan-web-spin"></div></div>`;
  if(id==='cardrive') return `<div class="scan-fx scan-fx-car"><div class="car-road"></div><div class="car-emoji-big">🏎️</div><div class="car-dust"></div></div>`;
  if(id==='portal') return `<div class="scan-fx scan-fx-portal"><div class="scan-portal-ring"></div></div>`;
  if(id==='fuego') return `<div class="scan-fx scan-fx-fire"><div class="scan-fire-emoji">🔥</div><span class="ember" style="left:44%; animation-delay:0s;"></span><span class="ember" style="left:52%; animation-delay:.3s;"></span><span class="ember" style="left:58%; animation-delay:.6s;"></span><span class="ember" style="left:47%; animation-delay:.9s;"></span></div>`;
  if(id==='rayo') return `<div class="scan-fx scan-fx-rayo"><div class="flash"></div><div class="scan-rayo-emoji">⚡</div></div>`;
  if(id==='diamante') return `<div class="scan-fx scan-fx-diamante"><div class="scan-diamante-emoji">💎</div>${Array.from({length:5}).map((_,i)=>`<span style="--i:${i}"></span>`).join('')}</div>`;
  if(id==='luna') return `<div class="scan-fx scan-fx-luna"><div class="scan-luna-emoji">🌙</div>${Array.from({length:6}).map((_,i)=>`<span class="star" style="left:${10+i*15}%; top:${15+(i%3)*25}%; animation-delay:${i*0.2}s;"></span>`).join('')}</div>`;
  if(id==='bigbang') return `<div class="scan-fx scan-fx-bigbang" style="--rc:#ffb23f"><div class="core"></div>${Array.from({length:10}).map((_,i)=>{const a=(i/10)*Math.PI*2; const d=90; return `<span class="spark" style="--sx:${(Math.cos(a)*d).toFixed(1)}px; --sy:${(Math.sin(a)*d).toFixed(1)}px; animation-duration:1.1s; animation-delay:${(i*0.04).toFixed(2)}s;"></span>`;}).join('')}</div>`;
  return `<div class="scan-line"></div>`;
}

/* ============ COUNTDOWN HELPERS ============ */
function msRemaining(){ if(!APP.user || !APP.user.spiderEventEndsAt) return null; return Math.max(0, APP.user.spiderEventEndsAt - Date.now()); }
function formatCountdown(ms){
  if(ms==null) return '';
  const s = Math.floor(ms/1000);
  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return `${d}d ${h}h ${m}m ${sec}s`;
}
function formatHMS(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return `${h}h ${m}m ${sec}s`;
}
function startLiveCountdownTicker(){
  if(APP.countdownInterval){ clearInterval(APP.countdownInterval); APP.countdownInterval=null; }
  const tick = ()=>{
    document.querySelectorAll('.live-countdown[data-target]').forEach(el=>{
      const target = parseInt(el.dataset.target,10);
      const rem = target - Date.now();
      const ready = el.dataset.ready || '';
      const prefix = el.dataset.prefix || '';
      el.textContent = rem>0 ? (prefix+formatCountdown(rem)) : ready;
    });
  };
  tick();
  APP.countdownInterval = setInterval(tick, 1000);
}

function countryLineHtml(obj, lang){
  if(obj.countryIso){
    const c = countryByIso(obj.countryIso);
    if(c) return `<div class="obj-country">📍 ${flagEmoji(c.iso)} ${escapeHtml(c.name)}</div>`;
  }
  return `<div class="obj-country">🌐 ${COUNTRY_NONE_LABEL[lang]||COUNTRY_NONE_LABEL.es}</div>`;
}

function showDebugToast(msg){
  console.error('[Firestore]', msg);
  const toast = document.createElement('div');
  toast.className = 'saved-toast';
  toast.style.background = 'var(--danger)';
  toast.style.maxWidth = '88%';
  toast.style.fontSize = '11px';
  toast.style.lineHeight = '1.4';
  toast.style.zIndex = '999';
  toast.textContent = '⚠️ DB: ' + msg;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 6000);
}
async function firestoreGet(collection, docId){
  try{
    const res = await fetch(`${FIRESTORE_BASE}/${collection}/${encodeURIComponent(docId)}?key=${firebaseConfig.apiKey}`);
    if(res.status===404) return null;
    if(!res.ok){ const t = await res.text().catch(()=>''); showDebugToast('GET '+res.status+' '+t.slice(0,140)); return null; }
    const data = await res.json();
    if(!data.fields || !data.fields.data) return null;
    return JSON.parse(data.fields.data.stringValue);
  }catch(e){ showDebugToast('GET fallo: '+(e&&e.message||e)); return null; }
}
async function firestoreSet(collection, docId, obj){
  try{
    const res = await fetch(`${FIRESTORE_BASE}/${collection}/${encodeURIComponent(docId)}?key=${firebaseConfig.apiKey}`, {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ fields: { data: { stringValue: JSON.stringify(obj) } } })
    });
    if(!res.ok){ const t = await res.text().catch(()=>''); showDebugToast('SET '+res.status+' '+t.slice(0,140)); }
  }catch(e){ showDebugToast('SET fallo: '+(e&&e.message||e)); }
}
async function firestoreDelete(collection, docId){
  try{
    const res = await fetch(`${FIRESTORE_BASE}/${collection}/${encodeURIComponent(docId)}?key=${firebaseConfig.apiKey}`, {method:'DELETE'});
    if(!res.ok){ const t = await res.text().catch(()=>''); showDebugToast('DEL '+res.status+' '+t.slice(0,140)); }
  }catch(e){ showDebugToast('DEL fallo: '+(e&&e.message||e)); }
}
async function firestoreList(collection){
  try{
    const res = await fetch(`${FIRESTORE_BASE}/${collection}?key=${firebaseConfig.apiKey}`);
    if(!res.ok){ const t = await res.text().catch(()=>''); showDebugToast('LIST '+res.status+' '+t.slice(0,140)); return []; }
    const data = await res.json();
    const docs = data.documents || [];
    return docs.map(d=>{ try{ return JSON.parse(d.fields.data.stringValue); }catch(e){ return null; } }).filter(Boolean);
  }catch(e){ showDebugToast('LIST fallo: '+(e&&e.message||e)); return []; }
}

/* ============ STORAGE HELPERS (Firestore) ============ */
async function sha256Hex(str){
  try{
    const enc = new TextEncoder().encode(str);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=0; for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i))|0; }
    return 'fb'+(h>>>0).toString(16);
  }
}
async function saveAccount(u){
  await firestoreSet('accounts', u.username, u);
  try{
    let topRarityId = null, topOrder = 0;
    for(const o of APP.objects){
      const ord = (RARITIES[o.rarityId]||RARITIES.comun).order;
      if(ord>topOrder){ topOrder = ord; topRarityId = o.rarityId; }
    }
    const pub = {username:u.username, name:u.name||u.username, points:u.points||0, objectCount:APP.objects.length, topRarityId, frame:(u.equipped&&u.equipped.frame)||'none', title:u.equippedTitle||null, featured:u.featured||[], collectionPublic:!!u.collectionPublic, updatedAt:Date.now()};
    await firestoreSet('publicProfiles', u.username, pub);
  }catch(e){}
}

async function saveObjects(username, list){
  await firestoreSet('userObjects', username, {list});
  try{
    if(APP.user && APP.user.username===username && APP.user.collectionPublic){
      const recent = [...list].sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,30);
      await firestoreSet('publicCollections', username, {list: recent});
    }
  }catch(e){}
}

function normalizeUser(u){
  if(u.points==null) u.points = 0;
  if(!u.ownedPalettes) u.ownedPalettes = ['default'];
  if(!u.ownedLoadings) u.ownedLoadings = ['dots'];
  if(!u.ownedChatbgs) u.ownedChatbgs = ['default'];
  if(!u.ownedFrames) u.ownedFrames = ['none'];
  if(!u.equipped) u.equipped = {theme:'default', bubble:'default', loading:'dots', chatbg:'default'};
  if(!u.equipped.frame) u.equipped.frame = 'none';
  if(u.equippedTitle===undefined) u.equippedTitle = null;
  if(!u.claimedMissions) u.claimedMissions = [];
  if(u.secretClaimed==null) u.secretClaimed = false;
  if(!u.featured) u.featured = [];
  if(u.collectionPublic==null) u.collectionPublic = false;
  return u;
}

/* ============ STARFIELD ============ */
(function starfield(){
  const cvs = document.getElementById('stars'); const ctx = cvs.getContext('2d'); let stars = [];
  function resize(){
    cvs.width = window.innerWidth; cvs.height = window.innerHeight; stars = [];
    const n = Math.floor((cvs.width*cvs.height)/9000);
    for(let i=0;i<n;i++){ stars.push({x:Math.random()*cvs.width, y:Math.random()*cvs.height, r:Math.random()*1.4+0.3,
      speed:Math.random()*0.015+0.003, phase:Math.random()*Math.PI*2}); }
  }
  window.addEventListener('resize', resize); resize();
  function loop(t){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    const g = ctx.createRadialGradient(cvs.width*0.5,cvs.height*0.15,0,cvs.width*0.5,cvs.height*0.15,cvs.width*0.9);
    g.addColorStop(0,'rgba(20,40,90,0.35)'); g.addColorStop(1,'rgba(3,5,11,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,cvs.width,cvs.height);
    for(const s of stars){ const tw = 0.5 + 0.5*Math.sin(t*s.speed + s.phase);
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fillStyle = `rgba(190,215,255,${0.25+tw*0.65})`; ctx.fill(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

function setupGlobe(lang){
  const canvas = document.getElementById('globeCanvas');
  const size = Math.min(320, window.innerWidth-60);
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const cx = size/2, cy = size/2, R = size/2 - 14;
  let selected = null;

  function project(lat, lng){
    const latR = lat*Math.PI/180, lngR = lng*Math.PI/180; const eff = lngR - APP.rotY;
    const x3 = Math.cos(latR)*Math.sin(eff); const y3 = -Math.sin(latR); const z3 = Math.cos(latR)*Math.cos(eff);
    return {x: cx + x3*R, y: cy + y3*R, z: z3};
  }
  function drawGrid(){
    ctx.strokeStyle = 'rgba(120,170,255,0.16)'; ctx.lineWidth = 1;
    for(let lonStep=0; lonStep<360; lonStep+=30){
      ctx.beginPath(); let started=false;
      for(let lat=-90; lat<=90; lat+=4){ const p = project(lat, lonStep);
        if(p.z>-0.05){ if(!started){ ctx.moveTo(p.x,p.y); started=true; } else ctx.lineTo(p.x,p.y); } else started=false; }
      ctx.stroke();
    }
    for(let lat=-60; lat<=60; lat+=30){
      ctx.beginPath(); let started=false;
      for(let lon=0; lon<=360; lon+=4){ const p = project(lat, lon);
        if(p.z>-0.05){ if(!started){ ctx.moveTo(p.x,p.y); started=true; } else ctx.lineTo(p.x,p.y); } else started=false; }
      ctx.stroke();
    }
  }
  const dotPositions = [];
  function draw(){
    ctx.clearRect(0,0,size,size);
    const sphereGrad = ctx.createRadialGradient(cx-R*0.35, cy-R*0.35, R*0.1, cx, cy, R*1.05);
    sphereGrad.addColorStop(0, 'rgba(63,139,255,0.28)'); sphereGrad.addColorStop(0.6, 'rgba(20,40,90,0.35)'); sphereGrad.addColorStop(1, 'rgba(4,8,18,0.55)');
    ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.fillStyle = sphereGrad; ctx.fill();
    ctx.lineWidth=1.4; ctx.strokeStyle='rgba(130,175,255,0.4)'; ctx.stroke();
    drawGrid(); dotPositions.length = 0;
    for(const c of COUNTRIES){
      const p = project(c.lat, c.lng);
      if(p.z > 0.02){
        const isSel = selected && selected.iso===c.iso;
        const rad = (isSel? 6.5:3.2) * (0.5+p.z*0.6);
        ctx.beginPath(); ctx.arc(p.x,p.y,rad,0,7);
        ctx.fillStyle = isSel ? '#ffc94a' : `rgba(120,190,255,${0.35+p.z*0.65})`;
        if(isSel){ ctx.shadowColor='#ffc94a'; ctx.shadowBlur=14; } else { ctx.shadowBlur=0; }
        ctx.fill(); ctx.shadowBlur=0;
        dotPositions.push({x:p.x,y:p.y,c});
      }
    }
    ctx.beginPath(); ctx.arc(cx,cy,R,0,7);
    const rim = ctx.createRadialGradient(cx,cy,R*0.85,cx,cy,R*1.02);
    rim.addColorStop(0,'rgba(63,139,255,0)'); rim.addColorStop(1,'rgba(63,139,255,0.55)');
    ctx.strokeStyle = rim; ctx.lineWidth=3; ctx.stroke();
  }
  function tick(){
    if(!APP.dragging && (Date.now()-APP.lastDrag>1200)){ APP.rotY += 0.0032; }
    draw(); APP.globeAnim = requestAnimationFrame(tick);
  }
  tick();
  let downX=0, startRot=0, moved=false;
  function pos(e){ const r=canvas.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left, y:t.clientY-r.top}; }
  function down(e){ const p=pos(e); downX=p.x; startRot=APP.rotY; APP.dragging=true; moved=false; e.preventDefault(); }
  function move(e){ if(!APP.dragging) return; const p=pos(e); const dx=p.x-downX; if(Math.abs(dx)>4) moved=true; APP.rotY = startRot + dx*0.012; APP.lastDrag=Date.now(); e.preventDefault(); }
  function up(e){
    APP.dragging=false; APP.lastDrag=Date.now();
    if(!moved){
      const p = pos(e.changedTouches? {clientX:e.changedTouches[0].clientX, clientY:e.changedTouches[0].clientY} : e);

      if(best) selectCountry(best);
    }
  }
  canvas.addEventListener('mousedown', down); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  canvas.addEventListener('touchstart', down, {passive:false}); canvas.addEventListener('touchmove', move, {passive:false}); canvas.addEventListener('touchend', up);

function resizeDataUrl(img, maxDim, quality){
  let w = img.width, h = img.height;
  if(w>h && w>maxDim){ h = h*(maxDim/w); w = maxDim; } else if(h>=w && h>maxDim){ w = w*(maxDim/h); h = maxDim; }
  const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
  canvas.getContext('2d').drawImage(img,0,0,w,h);
  return canvas.toDataURL('image/jpeg', quality);
}

function onFileChosen(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const dataUrl = resizeDataUrl(img, 800, 0.85);
      const thumbUrl = resizeDataUrl(img, 260, 0.72);
      APP.scanImageData = dataUrl;
      APP.scanThumbData = thumbUrl;
      startScanning(dataUrl, thumbUrl);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

async function identifyObject(dataUrl, lang){

  let categoryRule;
  if(cat.verify){
    categoryRule = `El usuario ha elegido escanear específicamente la categoría "${cat.label.es}". Si lo que ves en la foto NO pertenece a esa categoría, responde exactamente {"identified":false,"categoryMismatch":true,"message":"explica amablemente que eso no parece pertenecer a la categoría ${cat.label.es} y sugiere elegir la categoría correcta para analizarlo"}.
Si SÍ pertenece a la categoría "${cat.label.es}", identifica el tipo o especie/marca/plato concreto que veas — puede ser CUALQUIER coche, comida o animal que exista en el mundo real, no hay una lista cerrada ni límite.`;
  } else {
    categoryRule = 'El usuario ha elegido la categoría libre "Objetos": puede ser absolutamente cualquier cosa.';
  }
  const sys = `Eres la IA de la app Rareza.IA. Tu trabajo es mirar la foto de un objeto real y, a modo de juego, darle una clasificación coleccionable. Sé creativo pero coherente con lo que ves en la imagen.
${categoryRule}
Responde ÚNICAMENTE con un JSON válido, sin texto fuera del JSON, sin backticks. Cuando identified sea true usa este formato:
{"identified":true,"name":"nombre corto del objeto","category":"una categoría breve (Accesorio, Comida, Tecnología, Ropa, Naturaleza, Hogar, Juguete, Herramienta, Vehículo, Arte, Deporte, Música, Otro)","rarity":"uno de estos valores exactos: comun, poco_comun, raro, epico, legendario, mitico, prohibido, vip","countryIso":"código ISO2 de un país si el objeto está claramente asociado a una cultura o país concreto (ej. paella -> ES), o null si no tiene país claro","curiosity":"una frase curiosa, breve y entretenida sobre el objeto o su rareza, en tono de juego","isSpider":false,"isBackrooms":false}
El campo "isSpider" debe ser true si el objeto es una araña (de juguete, decorativa o real) y false en cualquier otro caso.
El campo "isBackrooms" debe ser true si la foto muestra una escena de una pantalla (televisión, proyector de cine, monitor) reproduciendo algo con estética "Backrooms" (espacio liminal, pasillos o habitaciones vacías de color amarillo con luz fluorescente parpadeante) y false en cualquier otro caso.

Asigna la rareza según lo difícil que sería encontrar ese objeto en la vida real: comun = está en todas partes, poco_comun/raro/epico = escala intermedia normal, legendario = muy difícil de encontrar, mitico = extremadamente único. "prohibido" y "vip" son los dos escalones más altos de todos, por encima de mitico, y deben usarse casi nunca — resérvalos solo para el caso extremadamente excepcional de algo casi imposible de encontrar en la vida real (vip es el escalón más alto y exclusivo de todos, incluso más raro que prohibido). Para el 99% de los objetos normales usa comun, poco_comun o raro. Responde los textos (name, category, curiosity, message) en el idioma: ${langName}.`;
  const messages = [
    { role:"system", content: sys },
    { role:"user", content:[
      { type:"text", text:"Identifica este objeto y clasifícalo según las instrucciones." },
      { type:"image_url", image_url:{ url: dataUrl } }
    ]}
  ];
  const raw0 = await callGroq(GROQ_VISION_MODEL, messages);
  const raw = raw0.replace(/<think>[\s\S]*?<\/think>/gi,'').replace(/<think>[\s\S]*/gi,'').trim().replace(/^```json/,'').replace(/^```/,'').replace(/```$/,'').trim();
  try{
    const parsed = JSON.parse(raw);
    if(parsed.identified===false){ showDebugToast('IA respondió no-identificado: '+raw.slice(0,160)); }
    return parsed;
  }catch(e){
    showDebugToast('Respuesta no interpretable: '+raw.slice(0,200));
    return {identified:false, message:null};

function applyBgMedia(container){
  if(!container) return;
  const old = container.querySelector('.app-bg-media');
  if(old) old.remove();
  const bgObj = chatbgById((APP.user.equipped&&APP.user.equipped.chatbg)||'default');
  if(bgObj.image){
    const div = document.createElement('div');
    div.className = 'app-bg-media';
    div.style.backgroundImage = `url('${bgObj.image}')`;
    container.insertBefore(div, container.firstChild);
  }
}

function renderMessages(lang){
  const body = document.getElementById('chatBody');
  const list = document.getElementById('chatMsgList');
  if(!body || !list) return;
  const L = LIMIT_I18N[lang] || LIMIT_I18N.es;
  list.innerHTML = APP.messages.map(m=>{
    if(m.kind==='text') return `<div class="bubble ${m.role==='user'?'user':'ai'}">${escapeHtml(m.text)}</div>`;
    if(m.kind==='err') return `<div class="bubble err">${escapeHtml(m.text)}</div>`;
    if(m.kind==='limit') return `<div class="limit-card glass"><div class="limit-ic">⌛</div><div class="limit-title">${L.title}</div><div class="limit-sub">${L.sub}</div><div class="limit-countdown" id="limitCountdown">--</div></div>`;
    return '';
  }).join('');
  body.scrollTop = body.scrollHeight;
  if(APP.countdownInterval){ clearInterval(APP.countdownInterval); APP.countdownInterval=null; }
  if(APP.limitCooldownUntil && APP.messages.length && APP.messages[APP.messages.length-1].kind==='limit'){
    const tick = ()=>{
      const el = document.getElementById('limitCountdown'); if(!el) return;
      const rem = APP.limitCooldownUntil - Date.now();
      el.textContent = rem>0 ? formatHMS(rem) : L.ready;
    };
    tick();
    APP.countdownInterval = setInterval(tick, 1000);
  }
}

async function sendMessage(lang){
  const input = document.getElementById('chatInput');
  const text = input.value.trim(); if(!text) return;
  input.value='';
  APP.messages.push({role:'user', kind:'text', text});
  renderMessages(lang);
  if(text === '0000'){
    let reply;
    if(!APP.user.secretClaimed){
      APP.user.points = (APP.user.points||0) + 1000;
      APP.user.secretClaimed = true;
      await saveAccount(APP.user);
      reply = {role:'ai', kind:'text', text: lang==='en'
        ? '🤫 How did you find this?! Don\'t tell anyone... here, take 1000 points for keeping the secret.'
        : '🤫 ¿Cómo has descubierto esto? No se lo digas a nadie... toma, 1000 puntos por guardar el secreto.'};
    } else {
      reply = {role:'ai', kind:'text', text: lang==='en'
        ? '🤫 You already used that secret code once, you sneaky explorer.'
        : '🤫 Ya usaste ese código secreto una vez, menudo pillín estás hecho.'};
    }
    APP.messages.push(reply);
    renderMessages(lang);
    return;
  }
  const body = document.getElementById('chatBody');
  const typingEl = document.createElement('div'); typingEl.className = 'typing-wrap';
  typingEl.innerHTML = loadingIndicatorHtml((APP.user.equipped&&APP.user.equipped.loading)||'dots');
  body.appendChild(typingEl); body.scrollTop = body.scrollHeight;
  try{
    const reply = await callAI(lang, text);
    typingEl.remove(); APP.messages.push(reply);
  }catch(e){
    typingEl.remove();
    APP.limitCooldownUntil = Date.now() + 5*3600*1000;
    APP.messages.push({role:'ai', kind:'limit'});
  }
  renderMessages(lang);
}

async function callAI(lang, userText){
  const langName = LANG_NAMES[lang] || 'español';
  const sys = `Eres el asistente de la app Rareza.IA (una app de escaneo y colección de objetos con rarezas asignadas por IA). Ayudas con curiosidades sobre objetos, cómo funciona la rareza, consejos para conseguir mejores rarezas, o charla general amigable. Responde SIEMPRE en el idioma: ${langName}. Sé cercano, natural y respetuoso, nunca robótico.
Debes responder ÚNICAMENTE con un objeto JSON válido, sin texto fuera del JSON, sin backticks: {"type":"text","content":"tu respuesta"}`;
  const messages = [{role:'system', content: sys}];
  APP.messages.filter(m=>m.kind==='text').slice(-10).forEach(m=> messages.push({role: m.role==='user'?'user':'assistant', content: m.text}));
  messages.push({role:'user', content: userText});
  const raw0 = await callGroq(GROQ_TEXT_MODEL, messages);
  const raw = raw0.replace(/<think>[\s\S]*?<\/think>/gi,'').replace(/<think>[\s\S]*/gi,'').trim().replace(/^```json/,'').replace(/^```/,'').replace(/```$/,'').trim();
  let parsed; try{ parsed = JSON.parse(raw); }catch(e){ parsed = {type:'text', content: raw || '...'}; }
  return {role:'ai', kind:'text', text: parsed.content || raw};
}

function renderMissions(lang){
  const L=(k)=>tr(lang,k);
  const claimed = APP.user.claimedMissions||[];
  const EVENT_END = {spider_hunt: APP.user.spiderEventEndsAt, backrooms_hunt: APP.user.backroomsEventEndsAt};
  const cards = MISSIONS.map(m=>{
    const progress = Math.min(m.progressFn(APP.objects), m.target);
    const done = progress>=m.target;
    const isClaimed = claimed.includes(m.id);
    const pct = Math.round((progress/m.target)*100);
    const endsAt = EVENT_END[m.id];
    const countdownHtml = endsAt ? `<div class="spider-countdown small live-countdown" data-target="${endsAt}" data-prefix="⏳ " data-ready="✅">--</div>` : '';
    return `<div class="mission-card glass">
      <div class="mission-top"><div class="mission-ic">${m.icon}</div>
        <div class="mission-txt"><h3>${m.title[lang]||m.title.es}</h3><p>${m.desc[lang]||m.desc.es}</p></div></div>
      <div class="mission-bar"><div class="mission-bar-fill" style="width:${pct}%"></div></div>
      <div class="mission-bottom">
        <span class="mission-progress">${progress}/${m.target}</span>
        <button class="btn ${isClaimed?'ghost':'primary'} small" ${(!done||isClaimed)?'disabled':''} data-id="${m.id}">
          ${isClaimed? '✓' : (done? ('🎁 +'+m.reward+' pts') : '🔒')}
        </button>
      </div>
      ${countdownHtml}
    </div>`;
  }).join('');
  app.innerHTML = `<div class="screen" id="screen-missions">
    <div class="top-bar"><span class="back" id="missBack">‹</span><h2>${L('menuMissionsTitle')}</h2></div>
    <div class="missions-list">${cards}</div>
  </div>`;
  document.getElementById('missBack').onclick = ()=> go('menu');
  if(APP.user.spiderEventEndsAt || APP.user.backroomsEventEndsAt) startLiveCountdownTicker();
  document.querySelectorAll('#screen-missions [data-id]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id;
      const m = MISSIONS.find(x=>x.id===id);
      const progress = Math.min(m.progressFn(APP.objects), m.target);
      if(progress<m.target || (APP.user.claimedMissions||[]).includes(id)) return;
      APP.user.claimedMissions.push(id);
      APP.user.points = (APP.user.points||0) + m.reward;
      if(m.unlockLoading && !APP.user.ownedLoadings.includes(m.unlockLoading)) APP.user.ownedLoadings.push(m.unlockLoading);
      if(m.unlockFrame && !APP.user.ownedFrames.includes(m.unlockFrame)) APP.user.ownedFrames.push(m.unlockFrame);
      if(m.unlockPalette && !APP.user.ownedPalettes.includes(m.unlockPalette)) APP.user.ownedPalettes.push(m.unlockPalette);
      await saveAccount(APP.user);
      render();
    };
  });
}

function shopItemCard(kind, item, lang, previewHtml){
  const ownedKey = ownedKeyFor(kind);
  const owned = (APP.user[ownedKey]||[]).includes(item.id);
  const equippedId = (APP.user.equipped||{})[kind];
  const isEquipped = equippedId===item.id;
  const label = item.name[lang]||item.name.es;
  const exclusiveLabel = lang==='en'?'Mission exclusive':lang==='fr'?'Exclusif de mission':lang==='it'?'Esclusivo di missione':lang==='de'?'Missionsexklusiv':lang==='pt'?'Exclusivo de missão':'Exclusivo de misión';
  const stateLabel = isEquipped? (lang==='en'?'Equipped':'Equipado') : owned? (lang==='en'?'Owned':'Adquirido') : (item.exclusive? ('🔒 '+exclusiveLabel) : (item.cost+' pts'));
  return `<div class="shop-item glass ${isEquipped?'equipped':''}" data-kind="${kind}" data-id="${item.id}" data-cost="${item.cost||0}" data-exclusive="${item.exclusive?1:0}">
    <div class="shop-preview">${previewHtml}</div>
    <div class="shop-name">${escapeHtml(label)}</div>
    <div class="shop-state ${isEquipped?'is-equipped':owned?'is-owned':''}">${stateLabel}</div>
  </div>`;
}
async function shopSelect(kind, id, cost){
  const ownedKey = ownedKeyFor(kind);
  const owned = APP.user[ownedKey] || [];
  if(!owned.includes(id)){
    if((APP.user.points||0) < cost){
      const toast = document.createElement('div'); toast.className='saved-toast';
      toast.style.background = 'var(--danger)';
      toast.textContent = APP.user.lang==='en' ? 'Not enough points' : 'Puntos insuficientes';
      document.body.appendChild(toast); setTimeout(()=>toast.remove(), 1600);
      return;
    }
    APP.user.points -= cost; owned.push(id); APP.user[ownedKey] = owned;
  }
  APP.user.equipped[kind] = id;
  await saveAccount(APP.user);
  applyEquipped();
  render();
}

          const msgEl = document.getElementById('giftMsg');
          if(!amt || amt<=0){ msgEl.textContent = T.giftInvalid; msgEl.style.color=''; return; }
          if((APP.user.points||0) < amt){ msgEl.textContent = T.giftNotEnough; msgEl.style.color=''; return; }
          APP.user.points -= amt;
          await saveAccount(APP.user);
          await sendGift(p.username, amt, APP.user.name||APP.user.username);
          msgEl.textContent = T.giftSent; msgEl.style.color = '#7be0a0';
        };
        document.getElementById('giftObjBtn').onclick = ()=>{
          const pickerEl = document.getElementById('giftObjPicker');
          if(pickerEl.dataset.open==='1'){ pickerEl.innerHTML=''; pickerEl.dataset.open='0'; return; }
          pickerEl.dataset.open='1';
          if(!APP.objects.length){ pickerEl.innerHTML = `<div class="gift-msg">${T.noObjects}</div>`; return; }
          pickerEl.innerHTML = `<div class="gift-obj-grid">${APP.objects.map(o=>objPhotoCardHtml(o,lang)).join('')}</div>`;
          pickerEl.querySelectorAll('[data-objid]').forEach(el=>{
            el.onclick = async ()=>{
              const obj = APP.objects.find(x=>x.id===el.dataset.objid);
              if(!obj) return;
              if(!confirm(T.giftObjConfirm.replace('{name}', obj.name))) return;
              APP.objects = APP.objects.filter(x=>x.id!==obj.id);
              await saveObjects(APP.user.username, APP.objects);
              await saveAccount(APP.user);
              await sendObjectGift(p.username, obj, APP.user.name||APP.user.username);
              pickerEl.innerHTML = `<div class="gift-msg" style="color:#7be0a0;">${T.giftSent}</div>`;
            };
          });
        };
      }
    }catch(e){ resultEl.innerHTML = `<div class="player-notfound">${T.notFound}</div>`; }
  }
  document.getElementById('playerSearchBtn').onclick = doSearch;
  document.getElementById('playerSearchInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });
  (async ()=>{
    const profiles = await fetchAllPublicProfiles();
    profiles.sort((a,b)=>(b.points||0)-(a.points||0));
    const top = profiles.slice(0,20);
    const listEl = document.getElementById('leaderboardList');
    if(!listEl) return;
    if(!top.length){ listEl.innerHTML = `<div class="player-notfound">${T.noPlayers}</div>`; return; }
    listEl.innerHTML = top.map((p,i)=>{
      const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':`#${i+1}`;
      return `<div class="leaderboard-row glass"><div class="lb-rank">${medal}</div><div class="lb-name">${frameWrapName(escapeHtml(p.name||p.username), p.frame||'none')}</div><div class="lb-points">✦ ${p.points||0}</div></div>`;
    }).join('');
  })();
}

/* ---------- GIFTS ---------- */
async function loadGifts(username){
  const d = await firestoreGet('gifts', username);
  return (d && d.list) || [];
}
async function clearGifts(username){ await firestoreDelete('gifts', username); }
async function sendGift(toUsername, amount, fromName){
  const newGift = {id:'g'+Date.now()+Math.random().toString(36).slice(2,6), from: fromName, points: amount, ts: Date.now()};
  const existing = await firestoreGet('gifts', toUsername);
  const list = (existing && existing.list) || [];
  list.push(newGift);
  await firestoreSet('gifts', toUsername, {list});
}
async function sendObjectGift(toUsername, obj, fromName){
  const newGift = {id:'g'+Date.now()+Math.random().toString(36).slice(2,6), from: fromName, object: obj, ts: Date.now()};
  const existing = await firestoreGet('gifts', toUsername);
  const list = (existing && existing.list) || [];
  list.push(newGift);
  await firestoreSet('gifts', toUsername, {list});
}
function showGiftPopup(gifts, lang){
  const totalPoints = gifts.reduce((s,g)=>s+(g.points||0),0);
  const objectGifts = gifts.filter(g=>g.object);
  const T = {
    title: lang==='en'?'You got a gift!':lang==='fr'?'Vous avez un cadeau !':lang==='it'?'Hai ricevuto un regalo!':lang==='de'?'Du hast ein Geschenk erhalten!':lang==='pt'?'Você recebeu um presente!':'¡Tienes un regalo!',
    claim: lang==='en'?'Claim':lang==='fr'?'Réclamer':lang==='it'?'Riscatta':lang==='de'?'Abholen':lang==='pt'?'Resgatar':'Reclamar'
  };
  const lines = gifts.map(g=> g.object
    ? (escapeHtml(g.from||'')+' → 🎁 '+escapeHtml(g.object.name||''))
    : (escapeHtml(g.from||'')+' → +'+(g.points||0)+' pts')
  ).join('<br>');
  const backdrop = document.createElement('div');
  backdrop.className = 'preview-backdrop';
  backdrop.innerHTML = `<div class="preview-modal glass">
      <div class="obj-emoji">🎁</div>
      <div class="obj-name">${T.title}</div>
      <div class="obj-curiosity">${lines}</div>
      ${totalPoints>0?`<div class="obj-points">+${totalPoints} pts</div>`:''}
      <button class="btn primary" id="claimGiftsBtn" style="margin-top:10px;">${T.claim}</button>
    </div>`;
  document.body.appendChild(backdrop);
  document.getElementById('claimGiftsBtn').onclick = async ()=>{
    APP.user.points = (APP.user.points||0) + totalPoints;
    if(objectGifts.length){
      objectGifts.forEach(g=>{ APP.objects.push({...g.object, id:'o'+Date.now()+Math.floor(Math.random()*1000)}); });
      await saveObjects(APP.user.username, APP.objects);
    }
    await saveAccount(APP.user);
    await clearGifts(APP.user.username);
    backdrop.remove();
    render();
  };
}

/* ---------- PROFILE (marco + títulos) ---------- */
function renderProfile(lang){
  const T = {
    title: lang==='en'?'My Profile':lang==='fr'?'Mon Profil':lang==='it'?'Il Mio Profilo':lang==='de'?'Mein Profil':lang==='pt'?'Meu Perfil':'Mi Perfil',
    titles: lang==='en'?'Titles':lang==='fr'?'Titres':lang==='it'?'Titoli':lang==='de'?'Titel':lang==='pt'?'Títulos':'Títulos',
    equipped: lang==='en'?'Equipped':lang==='fr'?'Équipé':lang==='it'?'Equipaggiato':lang==='de'?'Ausgerüstet':lang==='pt'?'Equipado':'Equipado',
    equip: lang==='en'?'Equip':lang==='fr'?'Équiper':lang==='it'?'Equipaggia':lang==='de'?'Ausrüsten':lang==='pt'?'Equipar':'Equipar',
    locked: lang==='en'?'Locked':lang==='fr'?'Verrouillé':lang==='it'?'Bloccato':lang==='de'?'Gesperrt':lang==='pt'?'Bloqueado':'Bloqueado',
    frameNote: lang==='en'?'Buy frames in the Shop':lang==='fr'?'Achetez des cadres dans la Boutique':lang==='it'?'Compra cornici nel Negozio':lang==='de'?'Kaufe Rahmen im Shop':lang==='pt'?'Compre molduras na Loja':'Compra marcos en la Tienda',
    showcase: lang==='en'?'Featured showcase':lang==='fr'?'Vitrine à la une':lang==='it'?'Vetrina in evidenza':lang==='de'?'Vitrine':lang==='pt'?'Vitrine em destaque':'Vitrina destacada',
    showcaseNote: lang==='en'?'Choose up to 3 objects other players will see first':lang==='fr'?'Choisissez jusqu\'à 3 objets que les autres verront en premier':lang==='it'?'Scegli fino a 3 oggetti che gli altri vedranno per primi':lang==='de'?'Wähle bis zu 3 Objekte, die andere zuerst sehen':lang==='pt'?'Escolha até 3 objetos que os outros verão primeiro':'Elige hasta 3 objetos que verán primero los demás',
    empty: lang==='en'?'Empty':lang==='fr'?'Vide':lang==='it'?'Vuoto':lang==='de'?'Leer':lang==='pt'?'Vazio':'Vacío',
    remove: lang==='en'?'Remove':lang==='fr'?'Retirer':lang==='it'?'Rimuovi':lang==='de'?'Entfernen':lang==='pt'?'Remover':'Quitar',
    privacy: lang==='en'?'Public collection (spy mode)':lang==='fr'?'Collection publique (mode espion)':lang==='it'?'Collezione pubblica (modalità spia)':lang==='de'?'Öffentliche Sammlung (Spionmodus)':lang==='pt'?'Coleção pública (modo espião)':'Colección pública (modo espía)',
    privacyNote: lang==='en'?'Lets other players browse your last 30 objects':lang==='fr'?'Permet aux autres de parcourir vos 30 derniers objets':lang==='it'?'Permette agli altri di sfogliare i tuoi ultimi 30 oggetti':lang==='de'?'Andere können deine letzten 30 Objekte durchsuchen':lang==='pt'?'Permite que outros vejam seus últimos 30 objetos':'Deja que otros vean tus últimos 30 objetos',
    on: lang==='en'?'Public ✅':lang==='fr'?'Publique ✅':lang==='it'?'Pubblica ✅':lang==='de'?'Öffentlich ✅':lang==='pt'?'Pública ✅':'Pública ✅',
    off: lang==='en'?'Private 🔒':lang==='fr'?'Privée 🔒':lang==='it'?'Privata 🔒':lang==='de'?'Privat 🔒':lang==='pt'?'Privada 🔒':'Privada 🔒'
  };
  const frame = frameById((APP.user.equipped||{}).frame||'none');
  const eqTitle = titleById(APP.user.equippedTitle);
  const featured = APP.user.featured||[];
  const slotsHtml = [0,1,2].map(i=>{
    const o = featured[i];
    if(o) return `<div class="showcase-slot filled" data-slot="${i}"><img src="${o.image||''}"><div class="showcase-slot-name">${escapeHtml(o.name)}</div></div>`;
    return `<div class="showcase-slot empty" data-slot="${i}"><div class="dex-q">+</div><div>${T.empty}</div></div>`;
  }).join('');
  app.innerHTML = `<div class="screen" id="screen-profile">
     <div class="top-bar"><span class="back" id="profBack">‹</span><h2>${T.title}</h2></div>
     <div class="profile-hero glass">
       ${frameWrapName(`<b>${escapeHtml(APP.user.name)}</b>`, frame.id)}
       ${eqTitle ? `<div class="player-title-tag">${eqTitle.name[lang]||eqTitle.name.es}</div>` : ''}
       <div class="points-badge" style="margin-top:8px;">✦ ${APP.user.points||0} pts</div>
       <div class="album-count" style="margin-top:4px;">${T.frameNote}</div>
     </div>
     <div class="wi-section-title">${T.showcase}</div>
     <div class="album-count" style="margin-bottom:8px;">${T.showcaseNote}</div>
     <div class="showcase-grid">${slotsHtml}</div>
     <div id="showcasePicker"></div>
     <div class="wi-section-title">${T.privacy}</div>
     <div class="album-count" style="margin-bottom:8px;">${T.privacyNote}</div>
     <button class="btn ${APP.user.collectionPublic?'primary':'ghost'} small" id="privacyToggle">${APP.user.collectionPublic?T.on:T.off}</button>
     <div class="wi-section-title" style="margin-top:18px;">${T.titles}</div>
     <div class="title-list" id="titleList"></div>
   </div>`;
  document.getElementById('profBack').onclick = ()=> go('menu');
  document.getElementById('privacyToggle').onclick = async ()=>{
    APP.user.collectionPublic = !APP.user.collectionPublic;
    await saveAccount(APP.user);
    if(APP.user.collectionPublic){ await saveObjects(APP.user.username, APP.objects); }
    else { await firestoreDelete('publicCollections', APP.user.username); }
    render();
  };
  document.querySelectorAll('.showcase-slot').forEach(slotEl=>{
    slotEl.onclick = ()=>{
      const idx = parseInt(slotEl.dataset.slot,10);
      const pickerEl = document.getElementById('showcasePicker');
      if(featured[idx]){
        featured.splice(idx,1);
        APP.user.featured = featured;
        saveAccount(APP.user).then(render);
        return;
      }
      if(pickerEl.dataset.open==='1'){ pickerEl.innerHTML=''; pickerEl.dataset.open='0'; return; }
      pickerEl.dataset.open='1';
      if(!APP.objects.length){ pickerEl.innerHTML = `<div class="album-count">${T.empty}</div>`; return; }
      pickerEl.innerHTML = `<div class="gift-obj-grid">${APP.objects.map(o=>objPhotoCardHtml(o,lang)).join('')}</div>`;
      pickerEl.querySelectorAll('[data-objid]').forEach(el=>{
        el.onclick = async ()=>{
          const obj = APP.objects.find(x=>x.id===el.dataset.objid);
          if(!obj) return;
          const arr = APP.user.featured||[];
          arr[idx] = {id:obj.id, name:obj.name, image:obj.image||null, rarityId:obj.rarityId, category:obj.category};
          APP.user.featured = arr.filter(Boolean).slice(0,3);
          await saveAccount(APP.user);
          render();
        };
      });
    };
  });
  const listEl = document.getElementById('titleList');
  listEl.innerHTML = TITLES.map(t=>{
    const unlocked = t.check(APP.objects, APP.user);
    const isEq = APP.user.equippedTitle===t.id;
    return `<div class="title-row glass ${unlocked?'':'locked'}">
      <div>${t.name[lang]||t.name.es}</div>
      <button class="btn ${isEq?'ghost':'primary'} small" data-title="${t.id}" ${(!unlocked||isEq)?'disabled':''}>
        ${isEq? '✓ '+T.equipped : unlocked? T.equip : '🔒 '+T.locked}
      </button>
    </div>`;
  }).join('');
  listEl.querySelectorAll('[data-title]').forEach(btn=>{
    btn.onclick = async ()=>{
      const tid = btn.dataset.title;
      const t = titleById(tid);
      if(!t || !t.check(APP.objects, APP.user)) return;
      APP.user.equippedTitle = tid;
      await saveAccount(APP.user);
      render();
    };
  });
}

/* ---------- SETTINGS ---------- */
function renderSettings(lang){
  const L=(k)=>tr(lang,k);
  const chips = COUNTRIES.map(c=>`<div class="country-chip ${c.name===APP.user.countryName?'active':''}" data-iso="${c.iso}">${flagEmoji(c.iso)} ${c.name}</div>`).join('');
  app.innerHTML = `<div class="screen" id="screen-settings">
     <div class="top-bar"><span class="back" id="setBack">‹</span><h2>${L('settingsTitle')}</h2></div>
     <div class="settings-block glass"><label>${L('nameLbl')}</label><input class="field" id="setName" value="${escapeHtml(APP.user.name)}"></div>
     <div class="settings-block glass"><label>${L('countryLbl')}</label><div class="country-select-list" id="setCountryList">${chips}</div></div>
     <button class="btn primary" id="setSave">${L('saveBtn')}</button>
     <button class="btn ghost" id="setLogout">🚪 ${L('logoutBtn')}</button>
   </div>`;
  let selectedIso = (COUNTRIES.find(c=>c.name===APP.user.countryName)||{}).iso || null;
  document.getElementById('setBack').onclick = ()=> go('menu');
  document.querySelectorAll('#setCountryList .country-chip').forEach(chip=>{
    chip.onclick = ()=>{ document.querySelectorAll('#setCountryList .country-chip').forEach(c=>c.classList.remove('active')); chip.classList.add('active'); selectedIso = chip.dataset.iso; };
  });
  document.getElementById('setSave').onclick = async ()=>{
    const name = document.getElementById('setName').value.trim();
    if(name) APP.user.name = name;
    if(selectedIso){ const country = countryByIso(selectedIso); APP.user.countryName = country.name; APP.user.lang = country.lang; }
    await saveAccount(APP.user);
    const toast = document.createElement('div'); toast.className='saved-toast'; toast.textContent = tr(APP.user.lang,'savedMsg');
    document.body.appendChild(toast); setTimeout(()=>toast.remove(), 1800);
    render();
  };
  document.getElementById('setLogout').onclick = async ()=>{
    await clearLastSession();
    APP.user=null; APP.objects=[]; APP.messages=[]; APP.authMode='login';
    go('auth');
  };
}

/* ============ BOOT ============ */
(async function boot(){
  try{
    const last = await getLastSession();
    if(last){
      const acc = await loadAccount(last);
      if(acc){ APP.user = normalizeUser(acc); APP.objects = await loadObjects(last); go(acc.onboarded ? 'menu' : 'onboarding'); return; }
    }
  }catch(e){}
  go('splash');
})();

})();
</script>
